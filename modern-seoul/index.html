:root{
  --paper:#F6F1E7;
  --paper2:#FFFCF5;
  --ink:#17161A;
  --ink2:#3A3630;
  --muted:#6E675B;
  --line:#E1D8C8;
  --line2:#CFC3AE;
  --red:#F4442E;
  --mint:#0FAE9C;
  --blue:#2F53FF;
  --coffee:#7B4A28;
  --ice:#BEE8FF;
  --pink:#FF6D9E;
  --violet:#7A5AF8;
  --night:#0C1030;
  --neon:#FFD166;
  --accent:var(--red);
  --r:18px;
  --shadow:0 1px 0 rgba(23,22,26,.05), 0 18px 40px -28px rgba(23,22,26,.55);
  --maxw:1160px;
  --f-display:'BHS', 'Noto Sans CJK KR', sans-serif;
  --f-body:'Gowun', 'Noto Sans CJK KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --f-mono:'Mono', ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
html,body{margin:0;padding:0;max-width:100%}
body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--f-body);
  font-size:16px;
  line-height:1.6;
  letter-spacing:-.01em;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
body::before{
  content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.55;
  background-image:radial-gradient(rgba(23,22,26,.055) 1px, transparent 1px);
  background-size:3px 3px;
  mix-blend-mode:multiply;
}
img,canvas,svg{max-width:100%}
button{font-family:inherit;color:inherit}
a{color:inherit}

.wrap{max-width:var(--maxw);margin:0 auto;padding:0 20px;position:relative;z-index:1}
.mono{font-family:var(--f-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}

/* ---------------- top bar ---------------- */
.topbar{
  position:sticky;top:0;z-index:60;
  background:rgba(246,241,231,.86);
  -webkit-backdrop-filter:blur(14px) saturate(1.2);
  backdrop-filter:blur(14px) saturate(1.2);
  border-bottom:1px solid var(--line);
}
.topbar-in{max-width:var(--maxw);margin:0 auto;padding:10px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;min-width:0}
.brand-mark{
  width:30px;height:30px;border-radius:9px;background:var(--ink);color:var(--paper2);
  display:grid;place-items:center;font-family:var(--f-display);font-size:15px;flex:none;
  transform:rotate(-6deg);
}
.brand-txt{display:flex;flex-direction:column;line-height:1.05;min-width:0}
.brand-txt b{font-family:var(--f-display);font-size:16px;letter-spacing:.03em;font-weight:400}
.brand-txt span{font-family:var(--f-mono);font-size:8.5px;letter-spacing:.18em;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:8px}

.lang{
  display:flex;align-items:center;gap:2px;padding:3px;border:1px solid var(--ink);border-radius:999px;background:var(--paper2);
}
.lang button{
  border:0;background:transparent;border-radius:999px;padding:5px 11px;cursor:pointer;
  font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;color:var(--ink);line-height:1.2;
}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--paper2)}
.lang button:focus-visible{outline:2px solid var(--red);outline-offset:2px}

.btn-hash{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--ink);background:transparent;
  border-radius:999px;padding:7px 13px;cursor:pointer;font-family:var(--f-mono);font-size:11px;letter-spacing:.09em;
  transition:transform .16s ease, background .16s ease, color .16s ease;
  white-space:nowrap;
}
.btn-hash:hover{background:var(--ink);color:var(--paper2);transform:translateY(-1px)}
.btn-hash:active{transform:translateY(0) scale(.98)}
.btn-hash:focus-visible{outline:2px solid var(--red);outline-offset:2px}

/* ---------------- hero ---------------- */
.hero{padding:44px 0 22px;position:relative}
.hero-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.pill{
  display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line2);border-radius:999px;
  padding:4px 11px;background:rgba(255,252,245,.7);font-family:var(--f-mono);font-size:10.5px;letter-spacing:.14em;color:var(--ink2);
}
.pill .dot{width:6px;height:6px;border-radius:50%;background:var(--red);animation:pulse 2.4s infinite}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

.hero h1{
  font-family:var(--f-display);font-weight:400;margin:0;
  font-size:clamp(40px,8.6vw,96px);line-height:.94;letter-spacing:-.015em;
}
.hero h1 .hl{color:var(--red)}
.hero h1 .out{-webkit-text-stroke:2px var(--ink);color:transparent}
.hero-sub{
  display:flex;gap:26px;align-items:flex-start;flex-wrap:wrap;
  margin-top:18px;padding-top:16px;border-top:1px solid var(--line);
}
.hero-sub p{margin:0;max-width:620px;font-size:16.5px;color:var(--ink2);line-height:1.7}
.hero-meta{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto}
.hero-meta div{min-width:64px}
.hero-meta b{display:block;font-family:var(--f-display);font-weight:400;font-size:22px;line-height:1.1}
.hero-meta span{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;color:var(--muted)}
.sticker{
  position:absolute;right:8px;top:6px;width:96px;height:96px;border-radius:50%;
  background:var(--red);color:#fff;display:grid;place-items:center;text-align:center;
  font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;line-height:1.45;
  transform:rotate(9deg);box-shadow:0 12px 26px -16px rgba(244,68,46,.9);
}
.sticker b{display:block;font-family:var(--f-display);font-weight:400;font-size:26px;letter-spacing:.02em;line-height:1}
@media (max-width:820px){.sticker{display:none}}

/* ---------------- course nav ---------------- */
.nav-wrap{padding:8px 0 6px}
.courses{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.course{
  position:relative;text-align:left;border:1px solid var(--line2);border-radius:16px;
  background:var(--paper2);padding:14px 14px 13px;cursor:pointer;overflow:hidden;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s, background .18s;
  display:flex;flex-direction:column;gap:2px;min-width:0;
}
.course:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--ink)}
.course .num{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.course .emo{font-size:24px;line-height:1.2;margin-top:6px}
.course b{font-family:var(--f-display);font-weight:400;font-size:15.5px;line-height:1.25;letter-spacing:.01em}
.course small{font-size:11.5px;color:var(--muted);line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.course .bar{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s ease}
.course[aria-selected="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper2);box-shadow:var(--shadow)}
.course[aria-selected="true"] .num,.course[aria-selected="true"] small{color:rgba(255,252,245,.62)}
.course[aria-selected="true"] .bar{transform:scaleX(1)}
.course:focus-visible{outline:2px solid var(--red);outline-offset:2px}
@media (max-width:760px){
  .courses{grid-template-columns:repeat(2,1fr)}
}

/* ---------------- panels ---------------- */
main{padding-bottom:40px;position:relative;z-index:1}
.panel{display:none;animation:fadeUp .38s ease both}
.panel.active{display:block}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

.p-head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;padding:26px 0 14px;border-bottom:1px solid var(--line);margin-bottom:22px}
.p-head h2{font-family:var(--f-display);font-weight:400;font-size:clamp(26px,4.4vw,44px);line-height:1;margin:0;letter-spacing:-.01em}
.p-head .kicker{font-family:var(--f-mono);font-size:10.5px;letter-spacing:.18em;color:var(--accent);margin-bottom:7px}
.p-head p{margin:0;margin-left:auto;max-width:420px;font-size:14px;color:var(--muted);line-height:1.65}
@media (max-width:760px){.p-head p{margin-left:0;max-width:100%}}

.sec-title{display:flex;align-items:center;gap:10px;margin:26px 0 12px}
.sec-title h3{font-family:var(--f-display);font-weight:400;font-size:19px;margin:0;letter-spacing:.01em}
.sec-title .rule{flex:1;height:1px;background:var(--line)}
.sec-title .tag{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.16em;color:var(--muted)}

.card{background:var(--paper2);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 0 rgba(23,22,26,.04)}
.pad{padding:18px}
.hint{font-size:12.5px;color:var(--muted);line-height:1.6}

/* ---------------- tab 1: store ---------------- */
.store-grid{display:grid;grid-template-columns:1.35fr .95fr;gap:20px;align-items:start}
@media (max-width:900px){.store-grid{grid-template-columns:1fr}}

.cat{margin-bottom:16px}
.cat-h{display:flex;align-items:baseline;gap:9px;margin:0 0 9px}
.cat-h b{font-family:var(--f-mono);font-size:10px;letter-spacing:.18em;color:var(--ink);font-weight:400}
.cat-h span{font-size:11.5px;color:var(--muted)}

.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:9px}
.item{
  position:relative;border:1px solid var(--line);border-radius:14px;background:var(--paper2);
  padding:12px 11px 10px;text-align:left;cursor:pointer;min-width:0;
  transition:transform .15s ease, border-color .15s, box-shadow .15s, background .15s;
}
.item:hover{transform:translateY(-2px);border-color:var(--ink);box-shadow:0 10px 20px -16px rgba(23,22,26,.7)}
.item .emo{font-size:26px;line-height:1.15;display:block;margin-bottom:6px;filter:saturate(.95)}
.item .nm{display:block;font-size:13px;line-height:1.3;font-weight:600;letter-spacing:-.01em;min-height:2.6em}
.item .pr{display:block;font-family:var(--f-body);font-size:12.5px;font-variant-numeric:tabular-nums;letter-spacing:0;color:var(--ink2);margin-top:5px}
.item .kcal{font-family:var(--f-mono);font-size:9px;color:var(--line2);letter-spacing:.04em}
.item[aria-pressed="true"]{border-color:var(--ink);background:#FFF7E8;box-shadow:inset 0 0 0 1px var(--ink)}
.item[aria-pressed="true"]::after{
  content:'✓';position:absolute;top:7px;right:8px;width:18px;height:18px;border-radius:50%;
  background:var(--ink);color:#fff;font-size:11px;display:grid;place-items:center;line-height:1;
}
.item:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.item[data-cat="drink"][aria-pressed="true"]{background:#EAF7FF}

/* tray */
.tray{position:sticky;top:74px}
@media (max-width:900px){.tray{position:static}}
.tray-in{padding:0;overflow:hidden}
.tray-top{padding:16px 18px 14px;border-bottom:1px dashed var(--line2);background:linear-gradient(180deg,#FFFDF7,#FFF7E6)}
.tray-top .mono{color:var(--red)}
.combo-name{font-family:var(--f-display);font-weight:400;font-size:25px;line-height:1.12;margin:6px 0 3px;letter-spacing:-.01em;min-height:28px}
.combo-ko{font-size:12.5px;color:var(--red);margin:1px 0 3px}
.combo-sub{font-size:12px;color:var(--muted)}
.tray-list{padding:12px 18px;max-height:210px;overflow:auto}
.trow{display:flex;align-items:baseline;gap:8px;padding:5px 0;font-size:13.5px;border-bottom:1px dotted var(--line)}
.trow:last-child{border-bottom:0}
.trow .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow .p{font-family:var(--f-mono);font-size:12px;color:var(--ink2)}
.trow .x{border:0;background:transparent;color:var(--line2);cursor:pointer;font-size:14px;padding:0 2px;line-height:1}
.trow .x:hover{color:var(--red)}
.tray-total{display:flex;align-items:baseline;justify-content:space-between;padding:11px 18px;border-top:1px solid var(--line);background:#FFFCF5}
.tray-total span{font-family:var(--f-mono);font-size:10px;letter-spacing:.16em;color:var(--muted)}
.tray-total b{font-family:var(--f-display);font-weight:400;font-size:23px}
.tray-total b .w{font-family:var(--f-mono);font-style:normal;font-size:.52em;vertical-align:.5em;color:var(--muted);letter-spacing:.02em;margin-right:2px}
.tray-empty{padding:22px 18px;text-align:center;color:var(--muted);font-size:13px}

.recipe{padding:6px 18px 16px}
.step{display:flex;gap:10px;padding:9px 0;border-top:1px dotted var(--line)}
.step:first-child{border-top:0}
.step .n{
  flex:none;width:20px;height:20px;border-radius:50%;border:1px solid var(--ink);
  display:grid;place-items:center;font-family:var(--f-mono);font-size:9.5px;margin-top:2px;
}
.step p{margin:0;font-size:13px;line-height:1.55}
.step-t{min-width:0}
.ord{
  position:absolute;top:7px;left:7px;z-index:2;width:20px;height:20px;border-radius:50%;
  background:var(--violet);color:#fff;font-family:var(--f-mono);font-size:10px;
  display:grid;place-items:center;line-height:1;box-shadow:0 3px 8px -3px rgba(0,0,0,.5);
}
.step p b{font-weight:600}
.step .lab{font-family:var(--f-mono);font-size:9px;letter-spacing:.13em;color:var(--red);display:block;margin-bottom:2px}

.tray-actions{padding:0 18px 18px;display:flex;flex-direction:column;gap:8px}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  border:1px solid var(--ink);border-radius:12px;padding:12px 16px;cursor:pointer;
  background:var(--ink);color:var(--paper2);font-family:var(--f-body);font-size:14px;font-weight:600;
  transition:transform .15s ease, box-shadow .15s, background .15s, color .15s;width:100%;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 12px 24px -16px rgba(23,22,26,.95)}
.btn:active{transform:translateY(0)}
.btn.alt{background:transparent;color:var(--ink);font-weight:400}
.btn.alt:hover{background:rgba(23,22,26,.06)}
.btn[disabled]{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.btn .ic{font-size:15px}

.tipbox{margin-top:12px;padding:13px 15px;border-left:3px solid var(--red);background:#FFF7E6;font-size:12.5px;line-height:1.65;color:var(--ink2)}
.tipbox b{font-weight:600}

/* ---------------- tab 2: cafe ---------------- */
.cafe-lead{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;margin-bottom:6px;align-items:start}
.cafe-left{display:flex;flex-direction:column;gap:12px;min-width:0}
.order-card{padding:16px 18px}
.orow{display:flex;align-items:baseline;gap:8px;padding:7px 0;border-bottom:1px dotted var(--line);font-size:13px}
.orow:last-of-type{border-bottom:0}
.orow .ko{font-weight:600;white-space:nowrap}
.orow .en{color:var(--muted);font-size:11.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.orow .pr{margin-left:auto;font-variant-numeric:tabular-nums;color:var(--ink2);font-size:12px;white-space:nowrap}
@media (max-width:520px){.orow .en{display:none}}
.culture-grid > .cul:last-child:nth-child(odd){grid-column:1/-1}
.story{border-top:1px solid var(--line);margin-top:14px;padding-top:2px}
.srow{display:flex;gap:10px;padding:7px 0;border-bottom:1px dotted var(--line)}
.srow:last-child{border-bottom:0}
.srow .n{font-family:var(--f-mono);font-size:9.5px;color:var(--violet);padding-top:3px}
.srow b{display:block;font-size:12.5px;font-weight:600;line-height:1.3}
.srow span{font-size:11.5px;color:var(--muted);line-height:1.45}
@media (max-width:860px){.cafe-lead{grid-template-columns:1fr}}
.cup-card{padding:18px;display:flex;gap:18px;align-items:center;background:linear-gradient(140deg,#EAF6FF,#FFF6EC);border:1px solid var(--line);border-radius:var(--r);position:relative;overflow:hidden}
.cup-card .txt h3{font-family:var(--f-display);font-weight:400;font-size:24px;margin:0 0 4px;line-height:1.15}
.cup-card .txt p{margin:0;font-size:13px;color:var(--ink2);line-height:1.6}
.cup-svg{width:110px;flex:none}
.cup-toggle{display:flex;gap:0;margin-top:10px;border:1px solid var(--ink);border-radius:999px;padding:2px;width:fit-content}
.cup-toggle button{border:0;background:transparent;border-radius:999px;padding:4px 12px;font-size:11.5px;cursor:pointer;font-family:var(--f-mono);letter-spacing:.08em}
.cup-toggle button[aria-pressed="true"]{background:var(--ink);color:var(--paper2)}

.flow{padding:16px 18px;display:grid;gap:2px}
.flow-row{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dotted var(--line)}
.flow-row:last-child{border-bottom:0}
.flow-row .i{font-family:var(--f-mono);font-size:10px;color:var(--coffee);width:18px;flex:none;padding-top:2px}
.flow-row b{display:block;font-size:13.5px;font-weight:600}
.flow-row span{font-size:12px;color:var(--muted);line-height:1.5}

.culture-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:760px){.culture-grid{grid-template-columns:1fr}}
.cul{border:1px solid var(--line);border-radius:14px;background:var(--paper2);overflow:hidden;transition:border-color .15s, box-shadow .2s}
.cul[data-open="true"]{border-color:var(--ink);box-shadow:var(--shadow)}
.cul-btn{width:100%;display:flex;align-items:center;gap:11px;padding:13px 14px;border:0;background:transparent;cursor:pointer;text-align:left}
.cul-btn .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-size:17px;background:#F2EADD;flex:none}
.cul-btn .t{flex:1;min-width:0}
.cul-btn .t b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.cul-btn .t span{display:block;font-size:11.5px;color:var(--muted);line-height:1.4;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cul-btn .pm{font-family:var(--f-mono);font-size:15px;color:var(--muted);transition:transform .2s}
.cul[data-open="true"] .cul-btn .pm{transform:rotate(45deg)}
.cul-body{max-height:0;overflow:hidden;transition:max-height .28s ease}
.cul[data-open="true"] .cul-body{max-height:520px}
.cul-body > div{padding:0 15px 15px 60px;font-size:12.5px;line-height:1.68;color:var(--ink2)}
.cul-body .why{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.14em;color:var(--coffee);display:block;margin-bottom:3px}
.cul-body p{margin:0 0 9px}
.cul-body .do{display:block;border-left:2px solid var(--coffee);padding-left:9px;font-size:12px;color:var(--muted)}
@media (max-width:520px){.cul-body > div{padding-left:15px}}

.phrases{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:720px){.phrases{grid-template-columns:1fr}}
.phrase .idx{font-family:var(--f-mono);font-size:9.5px;color:var(--muted);flex:none;width:18px;align-self:flex-start;padding-top:3px}
.phrase{
  display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
  border-radius:13px;background:var(--paper2);transition:border-color .15s, box-shadow .15s;
}
.phrase:hover{border-color:var(--ink)}
.phrase.playing{border-color:var(--coffee);box-shadow:0 0 0 3px rgba(123,74,40,.12)}
.phrase .body{flex:1;min-width:0}
.phrase .ko{font-size:16px;font-weight:600;line-height:1.35;letter-spacing:-.01em}
.phrase .rom{font-family:var(--f-mono);font-size:10.5px;color:var(--muted);letter-spacing:.02em;margin-top:1px}
.phrase .en{font-size:12px;color:var(--ink2);margin-top:2px}
.play{
  flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--ink);background:transparent;
  cursor:pointer;display:grid;place-items:center;font-size:14px;transition:background .15s, color .15s, transform .15s;
}
.play:hover{background:var(--ink);color:var(--paper2)}
.play:active{transform:scale(.94)}
.play.on{background:var(--coffee);border-color:var(--coffee);color:#fff;animation:ring .9s infinite}
@keyframes ring{0%,100%{box-shadow:0 0 0 0 rgba(123,74,40,.35)}50%{box-shadow:0 0 0 8px rgba(123,74,40,0)}}
.play:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.tts-note{font-size:11.5px;color:var(--muted);margin-top:8px;display:none}
.tts-note.show{display:block}

/* ---------------- tab 3: seongsu ---------------- */
.place-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:10px}
.place{
  border:1px solid var(--line);border-radius:15px;background:var(--paper2);padding:0;overflow:hidden;
  cursor:pointer;text-align:left;transition:transform .18s, box-shadow .18s, border-color .15s;
  display:flex;flex-direction:column;
}
.place:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--ink)}
.place .top{height:86px;position:relative;display:flex;align-items:flex-end;padding:10px 12px;overflow:hidden}
.place .top .nm{font-family:var(--f-display);font-weight:400;font-size:19px;color:#fff;line-height:1;text-shadow:0 1px 12px rgba(0,0,0,.25);position:relative;z-index:2}
.place .top .bg{position:absolute;inset:0;z-index:0}
.place .top .bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 20%,rgba(0,0,0,.42))}
.place .bod{padding:11px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.place .vibe{font-size:12px;line-height:1.5;color:var(--ink2)}
.place .meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
.chip-s{font-family:var(--f-mono);font-size:9px;letter-spacing:.08em;border:1px solid var(--line2);border-radius:999px;padding:2px 7px;color:var(--muted);white-space:nowrap}
.place[aria-expanded="true"]{border-color:var(--ink)}
.place-detail{padding:0 12px 12px;font-size:12px;color:var(--ink2);line-height:1.6;border-top:1px dashed var(--line);margin-top:2px}
.place-detail b{font-weight:600}

.poses{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media (max-width:640px){.poses{grid-template-columns:repeat(2,1fr)}}
.pose{position:relative;border:1px solid var(--line);border-radius:14px;background:var(--paper2);padding:8px 8px 10px;cursor:pointer;text-align:center;transition:transform .15s, border-color .15s, box-shadow .15s;min-width:0}
.pose:hover{transform:translateY(-2px);border-color:var(--ink)}
.pose[aria-pressed="true"]{border-color:var(--violet);box-shadow:inset 0 0 0 1.5px var(--violet);background:#F6F2FF}
.pose canvas{width:100%;height:auto;display:block;border-radius:8px}
.pose b{display:block;font-size:12.5px;margin-top:6px;line-height:1.3}
.pose span{display:block;font-size:10.5px;color:var(--muted);line-height:1.4;margin-top:1px}

.strip-builder{display:grid;grid-template-columns:.9fr 1.1fr;gap:20px;align-items:start}
@media (max-width:880px){.strip-builder{grid-template-columns:1fr}}
.ctrl{margin-bottom:14px}

.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:40px;height:40px;border-radius:11px;border:2px solid transparent;cursor:pointer;position:relative;padding:0;transition:transform .15s}
.sw:hover{transform:translateY(-2px)}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 3px rgba(23,22,26,.10), inset 0 0 0 2px rgba(255,255,255,.75);transform:translateY(-2px) scale(1.06)}
.phrase-chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line2);background:var(--paper2);border-radius:999px;padding:7px 12px;cursor:pointer;
  font-size:12.5px;transition:all .15s;line-height:1.2;
}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper2)}
.canvas-holder{border:1px solid var(--line);border-radius:16px;padding:12px;background:#EFE7D9;display:flex;justify-content:center}
.canvas-holder canvas{display:block;width:100%;max-width:372px;height:auto;border-radius:6px;box-shadow:0 14px 30px -18px rgba(23,22,26,.9);background:#fff}

/* ---------------- tab 4: night ---------------- */
.night-lead{background:var(--night);color:#F3F0FF;border-radius:var(--r);padding:20px;position:relative;overflow:hidden;border:1px solid #232a5c}
.night-lead::after{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(120% 60% at 80% 0%, rgba(255,209,102,.16), transparent 60%),
             radial-gradient(90% 50% at 10% 100%, rgba(122,90,248,.28), transparent 60%);
}
.night-lead .mono{color:var(--neon)}
.night-lead h3{font-family:var(--f-display);font-weight:400;font-size:clamp(22px,3.2vw,32px);margin:6px 0 6px;line-height:1.1}
.night-lead p{margin:0;font-size:13.5px;color:#C9C4E8;max-width:560px;line-height:1.7;position:relative;z-index:1}
.stars-bg{position:absolute;inset:0;opacity:.5;pointer-events:none}

.ramen{display:grid;grid-template-columns:1.05fr .95fr;gap:18px;align-items:start}
@media (max-width:860px){.ramen{grid-template-columns:1fr}}
.machine{background:#11143A;border-radius:16px;padding:18px;position:relative;overflow:hidden;border:1px solid #2A3169}
.machine .mono{color:#8E88C9}
.machine svg{display:block;width:100%;height:auto;margin:8px 0 12px}
.machine-bar{height:9px;border-radius:999px;background:#232a5c;overflow:hidden}
.machine-bar i{display:block;height:100%;width:0%;background:linear-gradient(90deg,#7A5AF8,#FFD166);transition:width .12s linear}
.machine-status{display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;color:#B9B3E0}
.machine-time{font-family:var(--f-display);font-size:22px;color:var(--neon);letter-spacing:.04em}
.machine .btn{background:var(--neon);color:#1B1435;border-color:var(--neon);margin-top:12px}
.machine .btn:hover{box-shadow:0 12px 26px -14px rgba(255,209,102,.8)}

.steps-n{padding:4px 0}
.sn{display:flex;gap:11px;padding:11px 0;border-bottom:1px dotted var(--line)}
.sn:last-child{border-bottom:0}
.sn .n{flex:none;width:24px;height:24px;border-radius:8px;background:#EFF1FF;display:grid;place-items:center;font-family:var(--f-mono);font-size:10.5px;color:#3A3F8F}
.sn b{display:block;font-size:13.5px;line-height:1.35}
.sn span{font-size:12px;color:var(--muted);line-height:1.55}

.night-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:820px){.night-grid{grid-template-columns:1fr}}
.ncard{border:1px solid var(--line);border-radius:14px;background:var(--paper2);padding:14px}
.ncard .ic{font-size:20px}
.ncard b{display:block;font-size:14px;margin-top:6px}
.ncard p{margin:4px 0 0;font-size:12px;color:var(--muted);line-height:1.6}
.ncard .kw{font-family:var(--f-mono);font-size:9px;letter-spacing:.1em;color:var(--neon);background:#141740;padding:2px 7px;border-radius:999px;display:inline-block;margin-top:8px;color:#FFD166}

.setup-grid{display:grid;grid-template-columns:.95fr 1.05fr;gap:20px;align-items:start}
@media (max-width:880px){.setup-grid{grid-template-columns:1fr}}
.opt-row{margin-bottom:13px}
.opt-row .lab{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.15em;color:var(--muted);margin-bottom:6px}
.opts{display:flex;gap:6px;flex-wrap:wrap}

/* ---------------- footer ---------------- */
footer{border-top:1px solid var(--line);margin-top:34px;padding:26px 0 40px;position:relative;z-index:1}
.foot{display:flex;gap:20px;flex-wrap:wrap;align-items:flex-start}
.foot .fb{font-family:var(--f-display);font-weight:400;font-size:17px;letter-spacing:.02em}
.foot p{margin:6px 0 0;font-size:12.5px;color:var(--muted);max-width:420px;line-height:1.7}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.tag-chip{border:1px solid var(--line2);border-radius:999px;padding:4px 10px;font-family:var(--f-mono);font-size:10px;letter-spacing:.05em;color:var(--ink2);background:var(--paper2);cursor:pointer}
.tag-chip:hover{background:var(--ink);color:var(--paper2);border-color:var(--ink)}
.foot-bottom{margin-top:22px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-family:var(--f-mono);font-size:9.5px;letter-spacing:.12em;color:var(--line2)}

.save-hint{display:none;font-size:11px;color:var(--muted);text-align:center;margin-top:7px;line-height:1.5}
@media (max-width:560px){.save-hint{display:block}}

/* ---------------- toast ---------------- */
#toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,18px);z-index:200;
  background:var(--ink);color:var(--paper2);border-radius:999px;padding:10px 18px;
  font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;
  box-shadow:0 18px 40px -20px rgba(0,0,0,.7);max-width:calc(100vw - 32px);text-align:center;
}

/* ---------------- korean accents (EN mode) ---------------- */
.kacc{
  font-family:var(--f-body);font-size:.6em;font-weight:400;letter-spacing:0;
  color:var(--muted);opacity:.95;white-space:nowrap;
}
h2 .kacc{font-size:.38em;vertical-align:.34em;margin-left:2px}
.mono .kacc{font-family:var(--f-body);letter-spacing:0;text-transform:none;font-size:11px;color:var(--ink2)}
.hero-top .kacc{font-size:11px;letter-spacing:0}

/* ---------------- footer links ---------------- */
.foot-links{margin-left:auto;min-width:210px}
.flink{
  display:flex;align-items:baseline;gap:8px;padding:5px 0;text-decoration:none;
  border-bottom:1px dotted var(--line2);color:var(--ink2);font-size:12.5px;
  transition:color .15s, border-color .15s;
}
.flink:hover{color:var(--red);border-color:var(--red)}
.flink .s{font-family:var(--f-mono);font-size:9px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.flink .ar{margin-left:auto;color:var(--line2);font-size:11px}
.flink:hover .ar{color:var(--red)}

/* ============================================================
   CANVAS CARDS — receipt / photo strip / night card
   Drawn by hand, offline, at 2x for crisp PNGs.
   ============================================================ */
const FD = '"BHS","Noto Sans CJK KR",sans-serif';
const FB = '"Gowun","Noto Sans CJK KR",sans-serif';
const FM = '"Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace';

const PAL = {
  ink: '#221F1B', inkSoft: '#5C554B', paper: '#FFFCF3', line: '#D8CDB8',
  red: '#F4442E', gold: '#B98A2E', violet: '#7A5AF8', pink: '#FF6D9E',
};

function rr(ctx, x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}

function setFont(ctx, size, family = FB, weight = '400', ls = 0) {
  ctx.font = weight + ' ' + size + 'px ' + family;
  try { ctx.letterSpacing = ls + 'px'; } catch (e) {}
}
function text(ctx, s, x, y, o = {}) {
  ctx.save();
  setFont(ctx, o.size || 14, o.family || FB, o.weight || '400', o.ls || 0);
  ctx.fillStyle = o.color || PAL.ink;
  ctx.textAlign = o.align || 'left';
  ctx.textBaseline = o.base || 'alphabetic';
  ctx.fillText(s, x, y);
  ctx.restore();
}
function wrapLines(ctx, s, maxW, size, family = FB, ls = 0) {
  ctx.save(); setFont(ctx, size, family, '400', ls);
  const words = String(s).split(' ');
  const out = []; let line = '';
  for (const w of words) {
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width <= maxW) { line = t; continue; }
    if (line) { out.push(line); line = ''; }
    if (ctx.measureText(w).width <= maxW) { line = w; continue; }
    let cur = '';
    for (const ch of w) {
      if (ctx.measureText(cur + ch).width > maxW && cur) { out.push(cur); cur = ch; }
      else cur += ch;
    }
    line = cur;
  }
  if (line) out.push(line);
  ctx.restore();
  return out;
}
function paragraph(ctx, s, x, y, maxW, size, opts = {}) {
  const lh = opts.lh || size * 1.55;
  const lines = wrapLines(ctx, s, maxW, size, opts.family || FB, opts.ls || 0);
  lines.forEach((ln, i) => text(ctx, ln, x, y + i * lh, { size, family: opts.family, color: opts.color, align: opts.align, base: 'top', ls: opts.ls }));
  return y + lines.length * lh;
}
function dashed(ctx, x1, y1, x2, y2, color = PAL.line, dash = [5, 5]) {
  ctx.save(); ctx.strokeStyle = color; ctx.lineWidth = 1; ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke(); ctx.restore();
}
function money(n) { return '₩' + n.toLocaleString('en-US'); }
function bigMoney(ctx, n, xRight, y, size, color, family) {
  const num = n.toLocaleString('en-US');
  setFont(ctx, size, family || FD);
  const w = ctx.measureText(num).width;
  text(ctx, num, xRight, y, { size, family: family || FD, color, align: 'right' });
  text(ctx, '₩', xRight - w - size * 0.06, y - size * 0.02, { size: size * 0.58, family: FM, color, align: 'right' });
}
function seedRand(seed) {
  let s = seed % 2147483647; if (s <= 0) s += 2147483646;
  return () => (s = s * 16807 % 2147483647) / 2147483647;
}

/* ---------------- line-art figure for the photo strip ---------------- */
function heartPath(ctx, cx, cy, s) {
  ctx.beginPath();
  ctx.moveTo(cx, cy + s * 0.35);
  ctx.bezierCurveTo(cx - s * 1.1, cy - s * 0.35, cx - s * 0.45, cy - s * 1.05, cx, cy - s * 0.45);
  ctx.bezierCurveTo(cx + s * 0.45, cy - s * 1.05, cx + s * 1.1, cy - s * 0.35, cx, cy + s * 0.35);
  ctx.stroke();
}
function drawHand(ctx, x, y, s, rot) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(rot || 0);
  rr(ctx, -s * .28, -s * .3, s * .56, s * .62, s * .22); ctx.stroke();
  ctx.restore();
}
function drawFigure(ctx, cx, cy, s, pose, ink) {
  ctx.save();
  ctx.strokeStyle = ink; ctx.lineWidth = Math.max(2, s * 0.045); ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  const bodyY = cy + s * 1.15;
  /* shoulders */
  ctx.beginPath();
  ctx.moveTo(cx - s * 1.25, bodyY + s * .9);
  ctx.bezierCurveTo(cx - s * 1.2, bodyY - s * .05, cx - s * .55, bodyY - s * .3, cx, bodyY - s * .3);
  ctx.bezierCurveTo(cx + s * .55, bodyY - s * .3, cx + s * 1.2, bodyY - s * .05, cx + s * 1.25, bodyY + s * .9);
  ctx.stroke();
  /* neck */
  ctx.beginPath(); ctx.moveTo(cx - s * .2, cy + s * .75); ctx.lineTo(cx - s * .2, cy + s * .95);
  ctx.moveTo(cx + s * .2, cy + s * .75); ctx.lineTo(cx + s * .2, cy + s * .95); ctx.stroke();
  /* head */
  ctx.beginPath(); ctx.ellipse(cx, cy, s * .62, s * .74, 0, 0, Math.PI * 2); ctx.stroke();
  /* hair / fringe */
  ctx.beginPath();
  ctx.moveTo(cx - s * .62, cy - s * .12);
  ctx.bezierCurveTo(cx - s * .58, cy - s * .95, cx + s * .58, cy - s * .95, cx + s * .62, cy - s * .12);
  ctx.stroke();
  /* eyes */
  ctx.fillStyle = ink;
  if (pose === 'deadpan') {
    ctx.beginPath(); ctx.moveTo(cx - s * .32, cy + s * .04); ctx.lineTo(cx - s * .14, cy + s * .04);
    ctx.moveTo(cx + s * .14, cy + s * .04); ctx.lineTo(cx + s * .32, cy + s * .04); ctx.stroke();
  } else {
    ctx.beginPath(); ctx.arc(cx - s * .23, cy + s * .06, s * .055, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + s * .23, cy + s * .06, s * .055, 0, 7); ctx.fill();
  }
  /* mouth */
  ctx.beginPath();
  if (pose === 'deadpan') { ctx.moveTo(cx - s * .1, cy + s * .42); ctx.lineTo(cx + s * .1, cy + s * .42); }
  else if (pose === 'gyaru') { ctx.arc(cx, cy + s * .28, s * .16, 0.15, Math.PI - 0.15); }
  else { ctx.arc(cx, cy + s * .3, s * .13, 0.2, Math.PI - 0.2); }
  ctx.stroke();
  /* hands by pose */
  const hy = cy + s * .18;
  if (pose === 'cheek') {
    ctx.beginPath(); ctx.arc(cx - s * .66, hy, s * .17, -1.2, 2.4); ctx.stroke();
    ctx.beginPath(); ctx.arc(cx + s * .66, hy, s * .17, 0.7, 4.3); ctx.stroke();
    ctx.save(); ctx.globalAlpha = .45; ctx.strokeStyle = PAL.red; ctx.lineWidth = s * .05;
    heartPath(ctx, cx, cy - s * 1.0, s * .2); ctx.restore();
  } else if (pose === 'v' || pose === 'gyaru') {
    const dirs = pose === 'v' ? [1] : [-1, 1];
    dirs.forEach(d => {
      const hx = cx + d * s * .80, hy2 = cy + s * .34;
      ctx.save(); ctx.translate(hx, hy2); ctx.scale(d, 1);
      /* palm */
      rr(ctx, -s * .13, -s * .06, s * .30, s * .30, s * .13); ctx.stroke();
      /* two fingers in a V */
      ctx.beginPath(); ctx.moveTo(0, -s * .04); ctx.lineTo(-s * .10, -s * .56); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(s * .15, -s * .04); ctx.lineTo(s * .28, -s * .48); ctx.stroke();
      /* thumb */
      ctx.beginPath(); ctx.moveTo(-s * .10, s * .12); ctx.lineTo(-s * .22, s * .08); ctx.stroke();
      ctx.restore();
    });
  } else if (pose === 'finger') {
    ctx.save(); ctx.strokeStyle = ink; ctx.lineWidth = Math.max(2, s * .05);
    heartPath(ctx, cx + s * .1, cy + s * .62, s * .19);
    ctx.restore();
    drawHand(ctx, cx + s * .12, cy + s * .82, s * .42, 0);
  } else if (pose === 'chin') {
    drawHand(ctx, cx - s * .05, cy + s * .58, s * .55, -1.35);
    ctx.beginPath(); ctx.moveTo(cx - s * .42, cy + s * .56); ctx.lineTo(cx + s * .3, cy + s * .5); ctx.stroke();
  }
  ctx.restore();
}

/* ============================================================
   1. RECEIPT
   ============================================================ */
function drawReceipt(ctx, W, data) {
  const pad = 30, inW = W - pad * 2;
  ctx.fillStyle = PAL.paper; ctx.fillRect(0, 0, W, 4000);
  /* torn top edge */
  ctx.fillStyle = '#EFE7D6';
  ctx.beginPath();
  ctx.moveTo(0, 0); ctx.lineTo(W, 0); ctx.lineTo(W, 14);
  for (let x = W; x > 0; x -= 16) ctx.lineTo(x - 8, 4), ctx.lineTo(x - 16, 14);
  ctx.lineTo(0, 14); ctx.closePath(); ctx.fill();

  let y = 46;
  text(ctx, 'DANBI LAB', pad, y, { size: 13, family: FM, ls: 4, color: PAL.ink });
  text(ctx, data.no, W - pad, y, { size: 12, family: FM, ls: 1, color: PAL.inkSoft, align: 'right' });
  y += 16;
  text(ctx, 'CONVENIENCE LAB · SEOUL', pad, y, { size: 9.5, family: FM, ls: 2.4, color: PAL.inkSoft });
  y += 26;
  dashed(ctx, pad, y, W - pad, y);
  y += 26;

  /* combo name */
  const nameLines = wrapLines(ctx, data.name, inW - 6, 30, FD);
  nameLines.forEach(l => { text(ctx, l, pad, y, { size: 30, family: FD, color: PAL.ink }); y += 34; });
  if (data.nameKo) {
    y += 2;
    text(ctx, data.nameKo, pad, y, { size: 15, family: FB, color: PAL.inkSoft });
    y += 20;
  }
  y += 4;
  text(ctx, data.date + '  ' + data.time, pad, y, { size: 9.5, family: FM, ls: 1.4, color: PAL.inkSoft });
  y += 22;
  dashed(ctx, pad, y, W - pad, y);
  y += 20;

  /* items */
  data.items.forEach(it => {
    ctx.save();
    setFont(ctx, 13.5, FB); ctx.fillStyle = PAL.ink;
    const priceW = 84;
    let name = it.name;
    while (ctx.measureText(name).width > inW - priceW - 10 && name.length > 4) name = name.slice(0, -1);
    if (name !== it.name) name = name.slice(0, -1) + '…';
    ctx.fillText(name, pad, y);
    ctx.restore();
    text(ctx, money(it.price), W - pad, y, { size: 12.5, family: FM, color: PAL.ink, align: 'right' });
    y += 21;
    if (it.sub) { text(ctx, it.sub, pad + 2, y, { size: 10, family: FB, color: '#8A8272' }); y += 15; }
  });
  y += 6;
  dashed(ctx, pad, y, W - pad, y);
  y += 22;

  text(ctx, data.totalLabel, pad, y + 4, { size: 9.5, family: FM, ls: 2.2, color: PAL.inkSoft });
  bigMoney(ctx, data.total, W - pad, y + 2, 27, PAL.ink);
  y += 22;
  text(ctx, 'VAT INCL. · CARD · ' + data.items.length + (data.items.length === 1 ? ' ITEM' : ' ITEMS'), pad, y + 8, { size: 8.6, family: FM, ls: 1.6, color: '#A79C88' });
  y += 22;
  dashed(ctx, pad, y, W - pad, y);
  y += 22;

  /* how to eat */
  text(ctx, data.howLabel, pad, y, { size: 9.5, family: FM, ls: 2.2, color: PAL.red });
  y += 18;
  data.steps.slice(0, 3).forEach((s, i) => {
    text(ctx, String(i + 1), pad, y + 2, { size: 10, family: FM, color: PAL.red });
    const after = paragraph(ctx, s.text, pad + 16, y, inW - 20, 11.6, { lh: 17, color: PAL.ink });
    y = after + 8;
  });
  y += 2;

  /* stamp */
  const sx = W - pad - 46, sy = y + 40;
  ctx.save();
  ctx.translate(sx, sy); ctx.rotate(-0.18);
  ctx.strokeStyle = PAL.red; ctx.globalAlpha = .78; ctx.lineWidth = 2.4;
  ctx.beginPath(); ctx.arc(0, 0, 38, 0, Math.PI * 2); ctx.stroke();
  ctx.beginPath(); ctx.arc(0, 0, 32, 0, Math.PI * 2); ctx.lineWidth = 1; ctx.stroke();
  text(ctx, data.stamp, 0, 4, { size: 19, family: FD, color: PAL.red, align: 'center' });
  ctx.globalAlpha = .78;
  text(ctx, 'DANBI', 0, 20, { size: 7, family: FM, color: PAL.red, align: 'center', ls: 2 });
  ctx.restore();
  y += 92;

  /* barcode */
  const rand = seedRand(data.total + 77);
  let bx = pad + 2;
  ctx.fillStyle = '#2B2620';
  while (bx < W - pad - 60) {
    const w = 1 + Math.floor(rand() * 3);
    if (rand() > .32) ctx.fillRect(bx, y, w, 40);
    bx += w + 1 + Math.floor(rand() * 2);
  }
  text(ctx, data.barcode, pad + 2, y + 54, { size: 9, family: FM, ls: 3, color: PAL.inkSoft });
  y += 74;

  /* foot lines */
  y = paragraph(ctx, data.footEn, pad, y, inW, 12, { lh: 17, color: PAL.ink });
  y += 2;
  y = paragraph(ctx, data.footKo, pad, y, inW, 13, { lh: 19, color: PAL.inkSoft });
  y += 14;
  text(ctx, data.againEn, pad, y, { size: 11.5, family: FB, color: PAL.ink });
  y += 17;
  text(ctx, data.againKo, pad, y, { size: 11.5, family: FB, color: PAL.inkSoft });
  y += 30;
  text(ctx, 'DANBI LAB · MADE IN SEOUL', W / 2, y, { size: 8.5, family: FM, ls: 2.2, color: '#A79C88', align: 'center' });
  y += 22;

  /* torn bottom */
  ctx.fillStyle = '#EFE7D6';
  ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y);
  for (let x = W; x > 0; x -= 16) ctx.lineTo(x - 8, y + 10), ctx.lineTo(x - 16, y);
  ctx.closePath(); ctx.fill();
  return y + 12;
}

/* ============================================================
   2. PHOTO STRIP
   ============================================================ */
function drawStrip(ctx, W, data) {
  const H = 1116;
  /* outer frame colour */
  ctx.fillStyle = data.frameColor; ctx.fillRect(0, 0, W, H);
  const dark = data.frameDark;
  const inW = W - 44, ix = 22, iy = 30;
  /* inner paper */
  ctx.fillStyle = data.paper; ctx.fillRect(ix, iy, inW, H - iy - 34);

  const c = dark ? '#F4EEE2' : PAL.ink;
  let y = iy + 26;
  text(ctx, data.head, W / 2, y, { size: 12, family: FM, ls: 4, color: c, align: 'center' });
  y += 16;
  text(ctx, data.date, W / 2, y, { size: 9.5, family: FM, ls: 2, color: dark ? '#B9AF9C' : PAL.inkSoft, align: 'center' });
  y += 22;

  const fw = inW - 26, fx = ix + 13, fh = 208, gap = 12;
  const tints = [['#FFE3EC', '#FFC9D9'], ['#DDEEFF', '#C3E2FF'], ['#E4F7EA', '#C7EED6'], ['#F3E4FF', '#E3CCFF']];
  data.poses.forEach((p, i) => {
    const fy = y + i * (fh + gap);
    ctx.save();
    rr(ctx, fx, fy, fw, fh, 6); ctx.clip();
    const g = ctx.createLinearGradient(fx, fy, fx + fw, fy + fh);
    g.addColorStop(0, tints[i % 4][0]); g.addColorStop(1, tints[i % 4][1]);
    ctx.fillStyle = g; ctx.fillRect(fx, fy, fw, fh);
    /* one soft blob, kept away from the labels */
    ctx.globalAlpha = .42;
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(fx + fw * .84, fy + fh * .26, fh * .26, 0, 7); ctx.fill();
    ctx.globalAlpha = .18;
    ctx.beginPath(); ctx.arc(fx + fw * .12, fy + fh * .78, fh * .3, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    drawFigure(ctx, fx + fw / 2, fy + fh * .40, fh * .235, p.id, '#2A2530');
    /* frame labels */
    text(ctx, p.no, fx + 12, fy + 24, { size: 10, family: FM, ls: 2, color: '#2A2530' });
    text(ctx, p.nameKo, fx + fw - 12, fy + 24, { size: 11, family: FB, color: '#2A2530', align: 'right' });
    text(ctx, p.name, fx + 12, fy + fh - 14, { size: 13, family: FD, color: '#2A2530' });
    ctx.restore();
    ctx.strokeStyle = 'rgba(0,0,0,.10)'; ctx.lineWidth = 1; rr(ctx, fx, fy, fw, fh, 6); ctx.stroke();
  });
  y += 4 * (fh + gap) + 14;

  text(ctx, data.phrase, W / 2, y, { size: 17, family: FD, color: c, align: 'center' });
  y += 20;
  text(ctx, data.phraseKo, W / 2, y, { size: 13, family: FB, color: dark ? '#CFC5B2' : PAL.inkSoft, align: 'center' });
  y += 26;
  text(ctx, '#ModernSeoul  #DanbiLab', W / 2, y, { size: 9, family: FM, ls: 2, color: dark ? '#AFA592' : '#8A8272', align: 'center' });
  y += 16;
  text(ctx, 'DANBI LAB · SEOUL', W / 2, y, { size: 8.5, family: FM, ls: 2.6, color: dark ? '#9C9280' : '#A79C88', align: 'center' });
  return H;
}

/* ============================================================
   3. NIGHT CARD
   ============================================================ */
function drawNight(ctx, W, data) {
  const H = 720;
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, '#080B24'); g.addColorStop(.55, '#171A45'); g.addColorStop(1, '#2A1B45');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const rand = seedRand(20261127);
  for (let i = 0; i < 90; i++) {
    const x = rand() * W, y = rand() * H * .62, r = rand() * 1.5 + .4;
    ctx.globalAlpha = .25 + rand() * .65;
    ctx.fillStyle = i % 9 === 0 ? '#FFD166' : '#FFFFFF';
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  ctx.globalAlpha = 1;

  /* moon with a soft halo */
  const mx = W - 88, my = 84;
  const halo = ctx.createRadialGradient(mx, my, 8, mx, my, 78);
  halo.addColorStop(0, 'rgba(255,243,208,.28)');
  halo.addColorStop(1, 'rgba(255,243,208,0)');
  ctx.fillStyle = halo; ctx.beginPath(); ctx.arc(mx, my, 78, 0, 7); ctx.fill();
  ctx.fillStyle = '#FFF3D0'; ctx.beginPath(); ctx.arc(mx, my, 24, 0, 7); ctx.fill();
  ctx.fillStyle = 'rgba(214,198,160,.45)';
  ctx.beginPath(); ctx.arc(mx - 7, my - 6, 4.2, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 6, my + 7, 3, 0, 7); ctx.fill();
  ctx.beginPath(); ctx.arc(mx + 9, my - 8, 2.2, 0, 7); ctx.fill();

  /* skyline */
  const baseY = 470;
  ctx.fillStyle = '#0A0D26';
  let bx = 0;
  while (bx < W) {
    const bw = 22 + rand() * 46, bh = 40 + rand() * 130;
    ctx.fillRect(bx, baseY - bh, bw, bh);
    /* windows */
    for (let wy = baseY - bh + 10; wy < baseY - 10; wy += 14) {
      for (let wx = bx + 5; wx < bx + bw - 6; wx += 11) {
        if (rand() > .62) { ctx.fillStyle = rand() > .8 ? '#FFD166' : '#7C6BE8'; ctx.globalAlpha = .75; ctx.fillRect(wx, wy, 3, 4); ctx.globalAlpha = 1; }
      }
    }
    ctx.fillStyle = '#0A0D26';
    bx += bw + 4;
  }
  /* river */
  const rg = ctx.createLinearGradient(0, baseY, 0, H);
  rg.addColorStop(0, '#1D2452'); rg.addColorStop(1, '#0B0E28');
  ctx.fillStyle = rg; ctx.fillRect(0, baseY, W, H - baseY);
  for (let i = 0; i < 26; i++) {
    const y = baseY + 6 + rand() * (H - baseY - 40);
    const w = 30 + rand() * 120, x = rand() * W;
    ctx.globalAlpha = .06 + rand() * .16;
    ctx.fillStyle = i % 4 === 0 ? '#FFD166' : '#9C8CFF';
    ctx.fillRect(x, y, w, 1.6);
  }
  /* moon reflection */
  const refl = ctx.createRadialGradient(W - 88, baseY + 26, 4, W - 88, baseY + 26, 120);
  refl.addColorStop(0, 'rgba(255,243,208,.30)');
  refl.addColorStop(1, 'rgba(255,243,208,0)');
  ctx.fillStyle = refl;
  ctx.fillRect(W - 240, baseY, 300, H - baseY);
  ctx.globalAlpha = 1;

  /* readability scrim over city + river */
  const sc = ctx.createLinearGradient(0, 300, 0, H);
  sc.addColorStop(0, 'rgba(8,10,32,0)');
  sc.addColorStop(.16, 'rgba(8,10,32,.30)');
  sc.addColorStop(.38, 'rgba(8,10,32,.62)');
  sc.addColorStop(.72, 'rgba(7,9,28,.86)');
  sc.addColorStop(1, 'rgba(6,8,24,.92)');
  ctx.fillStyle = sc; ctx.fillRect(0, 300, W, H - 300);

  /* ghost watermark, sits behind every word */
  ctx.save();
  ctx.globalAlpha = .05;
  setFont(ctx, 92, FD, '400', 10);
  ctx.fillStyle = '#FFFFFF';
  ctx.textAlign = 'center';
  ctx.fillText('SEOUL', W / 2, H - 132);
  ctx.restore();

  const pad = 36;
  let y = 52;
  text(ctx, 'SEOUL NIGHT SETUP', pad, y, { size: 10, family: FM, ls: 3.2, color: '#FFD166' });
  text(ctx, data.time, W - pad, y, { size: 10, family: FM, ls: 1.6, color: '#ADA6D8', align: 'right' });
  y += 34;
  const nameLines = wrapLines(ctx, data.name, W - pad * 2, 34, FD);
  nameLines.slice(0, 2).forEach(l => { text(ctx, l, pad, y, { size: 34, family: FD, color: '#FFF8EC' }); y += 38; });
  if (data.nameKo) { text(ctx, data.nameKo, pad, y + 2, { size: 14, family: FB, color: '#C9C1F0' }); y += 24; }
  text(ctx, data.moodLine, pad, y + 2, { size: 9.5, family: FM, ls: 2.2, color: '#9E96CC' });
  y += 30;

  /* setup panel (receipt-style, total inside) */
  const boxY = 200, boxH = 194;
  ctx.save();
  ctx.fillStyle = 'rgba(10,13,36,.86)';
  rr(ctx, pad, boxY, W - pad * 2, boxH, 14); ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.13)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.restore();

  let iy = boxY + 30;
  data.items.forEach(it => {
    ctx.fillStyle = it.color || '#FFD166';
    ctx.beginPath(); ctx.arc(pad + 20, iy - 4, 3.2, 0, 7); ctx.fill();
    text(ctx, it.label, pad + 34, iy, { size: 13.5, family: FB, color: '#F2ECFF' });
    text(ctx, it.value, W - pad - 16, iy, { size: 11.5, family: FM, color: '#B7AFF0', align: 'right' });
    iy += 31;
  });
  dashed(ctx, pad + 18, boxY + 146, W - pad - 18, boxY + 146, 'rgba(255,255,255,.18)', [4, 5]);
  text(ctx, data.totalLabel, pad + 20, boxY + 174, { size: 9.5, family: FM, ls: 2.2, color: '#9E96CC' });
  bigMoney(ctx, data.totalNum, W - pad - 18, boxY + 176, 26, '#FFD166');

  y = boxY + boxH + 26;
  if (data.healEn) y = paragraph(ctx, data.healEn, pad, y, W - pad * 2, 13, { lh: 20, color: '#EDE7FF' });
  if (data.healKo) y = paragraph(ctx, data.healKo, pad, y + (data.healEn ? 2 : 0), W - pad * 2, 13, { lh: 20, color: '#B7AFF0' });

  dashed(ctx, pad, H - 96, W - pad, H - 96, 'rgba(255,255,255,.16)', [4, 6]);
  text(ctx, data.caption, W / 2, H - 70, { size: 8.5, family: FM, ls: 2.6, color: '#8D85BE', align: 'center' });

  text(ctx, 'DANBI LAB · MADE IN SEOUL', W / 2, H - 26, { size: 8.5, family: FM, ls: 2.4, color: '#6A639B', align: 'center' });
  return H;
}

/* ---------------- export ---------------- */
function renderCard(drawFn, logicalW, maxH, scale) {
  const s = scale || 2;
  const c = document.createElement('canvas');
  c.width = Math.round(logicalW * s); c.height = Math.round(maxH * s);
  const ctx = c.getContext('2d');
  ctx.scale(s, s);
  const used = drawFn(ctx, logicalW);
  const out = document.createElement('canvas');
  out.width = c.width; out.height = Math.round(used * s);
  const octx = out.getContext('2d');
  octx.drawImage(c, 0, 0, c.width, out.height, 0, 0, c.width, out.height);
  return out;
}
function canvasToDownload(canvas, filename, done) {
  const go = url => {
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => { if (url.slice(0, 5) === 'blob:') URL.revokeObjectURL(url); }, 5000);
    if (done) done();
  };
  try {
    canvas.toBlob(b => { if (!b) return go(canvas.toDataURL('image/png')); go(URL.createObjectURL(b)); }, 'image/png');
  } catch (e) {
    try { go(canvas.toDataURL('image/png')); } catch (e2) { if (done) done(); }
  }
}

function seoulNow() {

  return { date: d.replace(/-/g, '.'), time: t };

const CAT_ORDER = { base: 0, addon: 1, drink: 2, dessert: 3 };
const selItems = () => S.store.map(id => STORE_ITEMS.find(i => i.id === id))
  .filter(Boolean)
  .sort((a, b) => (CAT_ORDER[a.cat] - CAT_ORDER[b.cat]));
const totalOf = items => items.reduce((a, b) => a + b.price, 0);

function findCombo(items) {
  const ids = items.map(i => i.id);
  let best = null;
  COMBOS.forEach(c => {
    if (c.ids.every(id => ids.includes(id)) && (!best || c.ids.length > best.ids.length)) best = c;
  });
  return best;
}

function recipeSteps() {
  const items = selItems();
  const steps = [];
  const base = items.find(i => i.cat === 'base');
  if (base) steps.push({ lab: L(STORE_UI.stepLabels.base), text: L(base.how) });
  items.filter(i => i.cat === 'addon').slice(0, 2).forEach(a => steps.push({ lab: L(STORE_UI.stepLabels.addon), text: L(a.how) }));
  const drink = items.find(i => i.cat === 'drink');
  if (drink) steps.push({ lab: L(STORE_UI.stepLabels.drink), text: L(drink.how) });
  const dessert = items.find(i => i.cat === 'dessert');
  if (dessert) steps.push({ lab: L(STORE_UI.stepLabels.dessert), text: L(dessert.how) });
  const combo = findCombo(items);
  if (items.length) steps.push({ lab: combo ? 'FINISH' : '', text: combo ? L(combo.tip) : L(STORE_UI.fallbackTip) });
  return steps;
}

function comboTitle(items) {
  const combo = findCombo(items);
  if (combo) return { name: L(combo.name), ko: combo.name.ko, sub: L(combo.tip) };
  const ids = items.map(i => i.id).join('|');
  let h = 0; for (const ch of ids) h = (h * 31 + ch.charCodeAt(0)) % 9973;
  const subs = STORE_UI.myOwnSubs[S.lang];
  return {
    name: S.lang === 'en' ? 'My own combo' : '나만의 조합',
    ko: '나만의 조합',
    sub: subs[h % subs.length],
  };
}

function addItem(id) {
  const item = STORE_ITEMS.find(i => i.id === id);
  if (!item) return;
  const has = S.store.includes(id);
  if (item.cat === 'base' || item.cat === 'drink' || item.cat === 'dessert') {
    const same = S.store.filter(x => {
      const it = STORE_ITEMS.find(i => i.id === x); return it && it.cat === item.cat;
    });
    S.store = S.store.filter(x => !same.includes(x));
    if (!has) S.store.unshift(id);
  } else {
    if (has) S.store = S.store.filter(x => x !== id);
    else {
      const adds = S.store.filter(x => (STORE_ITEMS.find(i => i.id === x) || {}).cat === 'addon');
      if (adds.length >= 3) { toast(L(UI.maxAddon)); return; }
      S.store.push(id);
    }
  }
}

function saveReceipt() {
  const items = selItems();
  if (!items.length) return;
  const t = comboTitle(items);
  const steps = recipeSteps();
  const { date, time } = seoulNow();
  const total = totalOf(items);
  const data = {
    no: 'NO.' + String(1000 + (total % 8999)),
    name: t.name,
    nameKo: S.lang === 'en' ? t.ko : null,
    date, time,
    items: items.map(i => ({ name: L(i.name), price: i.price, sub: L(i.note) })),
    total,
    totalLabel: L(STORE_UI.total),
    howLabel: L(STORE_UI.howHead).toUpperCase(),
    steps,
    stamp: '꿀조합',
    barcode: '* ' + date.replace(/\./g, ' ') + ' ' + String(total).padStart(4, '0') + ' *',
    footEn: L(STORE_UI.receiptFoot),

    againEn: L(STORE_UI.receiptFoot2),
    againKo: S.lang === 'en' ? STORE_UI.receiptFoot2.ko : '',
  };
  const canvas = renderCard(ctx => drawReceipt(ctx, 560, data), 560, 1500, 2);
  canvasToDownload(canvas, 'danbi_lab_seoul_receipt_' + date.replace(/\./g, '') + '.png', () => toast(L(T.saved)));
}

let speakingBtn = null;
function speakKorean(textStr, btn) {
  const reset = () => { if (btn) { btn.classList.remove('on'); btn.textContent = '▶'; } };
  if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') {
    const n = $('#ttsNote'); if (n) n.classList.add('show');
    toast(L(T.ttsNo)); return;
  }
  try { window.speechSynthesis.cancel(); } catch (e) {}
  try {
    const u = new SpeechSynthesisUtterance(textStr);
    u.lang = 'ko-KR'; u.rate = 0.92; u.pitch = 1;
    const voices = window.speechSynthesis.getVoices ? window.speechSynthesis.getVoices() : [];
    const ko = (voices || []).find(v => /^ko/i.test(v.lang));
    if (ko) u.voice = ko;
    u.onend = reset; u.onerror = reset;
    if (btn) { btn.classList.add('on'); btn.textContent = '❚❚'; }
    window.speechSynthesis.speak(u);
    clearTimeout(speakKorean._t);
    speakKorean._t = setTimeout(reset, 6500);
  } catch (e) { reset(); }
}

function drawPoseThumbs() {
  const tints = [['#FFE3EC', '#FFC9D9'], ['#DDEEFF', '#C3E2FF'], ['#E4F7EA', '#C7EED6'], ['#F3E4FF', '#E3CCFF'], ['#FFF1D6', '#FFE1B5'], ['#E8F1FF', '#D5E6FF']];
  document.querySelectorAll('canvas[data-pose-canvas]').forEach(cv => {
    const id = cv.getAttribute('data-pose-canvas');
    const i = PHOTO.poses.findIndex(p => p.id === id);
    const ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);
    const g = ctx.createLinearGradient(0, 0, W, H);
    g.addColorStop(0, tints[i % 6][0]); g.addColorStop(1, tints[i % 6][1]);
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    ctx.globalAlpha = .5; ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(W * .82, H * .22, H * .3, 0, 7); ctx.fill(); ctx.globalAlpha = 1;
    drawFigure(ctx, W / 2, H * .36, H * .225, id, '#2A2530');
  });
}

function stripData() {

  });
  const phrase = PHOTO.phrases[S.strip.phrase];
  return {
    frameColor: PHOTO.frames[S.strip.frame],
    frameDark: S.strip.frame === 3,
    paper: S.strip.frame === 3 ? '#151318' : '#FFFCF3',
    head: 'SEOUL · TODAY',

    poses,
    phrase: L(phrase),

}

let rafId = null;
function startMachine() {
  if (S.night.running) return;
  S.night.running = true; S.night.ran = true;
  const btn = document.getElementById('mBtn');
  const bar = document.getElementById('mBar');
  const timeEl = document.getElementById('mTime');
  const status = document.getElementById('mStatus');
  if (btn) btn.disabled = true;
  if (status) status.textContent = L(NIGHT.running);
  const total = 7000, t0 = performance.now();
  const fmt = sec => Math.floor(sec / 60) + ':' + String(Math.floor(sec % 60)).padStart(2, '0');
  cancelAnimationFrame(rafId);
  const frame = now => {
    const p = Math.min(1, (now - t0) / total);
    if (bar) bar.style.width = (p * 100) + '%';
    if (timeEl) timeEl.textContent = fmt(210 * (1 - p));
    if (p < 1) rafId = requestAnimationFrame(frame);
    else {
      S.night.running = false;
      if (btn) { btn.disabled = false; btn.textContent = '↻ ' + L(NIGHT.start); }
      if (status) status.textContent = L(NIGHT.done);
      if (timeEl) timeEl.textContent = '0:00';
    }
  };
  rafId = requestAnimationFrame(frame);
}

function switchTab(id) {
  S.tab = id;

  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + id));

async function copyTags() {
  const text = UI.copyTags;
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      await navigator.clipboard.writeText(text);
    } else { throw new Error('no clipboard'); }
    toast(L(T.hashDone));
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:-1000px;left:0';
    document.body.appendChild(ta); ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) {}
    ta.remove();
    toast(ok ? L(T.hashDone) : L(T.hashFail));
  }
}

/* ============================================================
   EVENTS
   ============================================================ */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (act === 'tab') { switchTab(el.dataset.tab); }
  else if (act === 'lang') { setLang(el.dataset.lang); }
  else if (act === 'hash') { copyTags(); }
  else if (act === 'item') {
    addItem(el.dataset.id);
    const items = selItems();
    document.querySelectorAll('.item').forEach(b => b.setAttribute('aria-pressed', String(S.store.includes(b.dataset.id))));
    renderTray();
  }
  else if (act === 'del') {
    S.store = S.store.filter(x => x !== el.dataset.id);
    const b = document.querySelector('.item[data-id="' + el.dataset.id + '"]');
    if (b) b.setAttribute('aria-pressed', 'false');
    renderTray();
  }
  else if (act === 'clearstore') {
    S.store = [];
    document.querySelectorAll('.item').forEach(b => b.setAttribute('aria-pressed', 'false'));
    renderTray();
  }
  else if (act === 'savereceipt') { saveReceipt(); }
  else if (act === 'cul') {
    const i = el.dataset.i;
    S.cafeOpen[i] = !S.cafeOpen[i];
    const box = el.closest('.cul');
    box.dataset.open = String(!!S.cafeOpen[i]);
    el.setAttribute('aria-expanded', String(!!S.cafeOpen[i]));
  }
  else if (act === 'cup') {
    S.cupHot = el.dataset.hot === '1';
    renderCafe();
  }
  else if (act === 'say') { speakKorean(el.dataset.text, el); }
  else if (act === 'place') {
    const d = el.querySelector('.place-detail');
    const open = d.hidden;
    d.hidden = !open;
    el.setAttribute('aria-expanded', String(open));
  }
  else if (act === 'pose') { togglePose(el.dataset.id); }
  else if (act === 'frame') { S.strip.frame = +el.dataset.i; renderPhoto(); }
  else if (act === 'pchip') { S.strip.phrase = +el.dataset.i; renderPhoto(); }
  else if (act === 'savestrip') { saveStrip(); }
  else if (act === 'start') { startMachine(); }
  else if (act === 'nopt') {
    S.night[el.dataset.g] = +el.dataset.i;
    document.querySelectorAll('[data-act="nopt"][data-g="' + el.dataset.g + '"]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.i === el.dataset.i)));
    redrawNight();
  }
  else if (act === 'savenight') { saveNight(); }
});

document.addEventListener('keydown', ev => {
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.matches('[role="button"]')) {
    ev.preventDefault(); ev.target.click();
  }
});
