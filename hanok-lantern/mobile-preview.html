<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Mobile preview · Wish Before It Flies</title>
<style>
  html,body{margin:0;background:#111;font-family:system-ui,sans-serif;color:#eee}
  .row{display:flex;gap:24px;padding:24px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
  figure{margin:0}
  figcaption{font-size:12px;opacity:.6;padding:8px 0;letter-spacing:.1em;text-transform:uppercase}
  iframe{display:block;border:0;border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.6);background:#000}
</style>
</head>
<body>
<div class="row">
  <figure>
    <figcaption>390 × 844 (iPhone)</figcaption>
    <iframe src="./index.html?v=6" width="390" height="844"></iframe>
  </figure>
  <figure>
    <figcaption>360 × 740 (Android)</figcaption>
    <iframe src="./index.html?v=6" width="360" height="740"></iframe>
  </figure>
</div>
</body>
</html>
