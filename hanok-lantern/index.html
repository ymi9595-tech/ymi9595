.danbi-back{display:inline-flex;align-items:center;gap:7px;flex:none;padding:7px 13px 7px 11px;
  border:1px solid rgba(255,236,205,.30);border-radius:999px;background:rgba(12,18,34,.34);
  color:#f7ecd6;font-family:inherit;font-size:11.5px;font-weight:400;line-height:1;
  letter-spacing:.03em;text-decoration:none;white-space:nowrap;pointer-events:auto;

  transition:background .18s,border-color .18s,transform .18s}
.danbi-back:hover{background:rgba(22,30,52,.78);border-color:rgba(255,228,182,.62);transform:translateY(-1px)}
.danbi-back:focus-visible{outline:2px solid #ffd08a;outline-offset:3px}

<body>

<div class="sky" aria-hidden="true">
  <picture>
    <source media="(max-aspect-ratio: 3/4)" srcset="assets/hanok-night-tall.jpg">
    <img src="assets/hanok-night-wide.jpg" alt="" fetchpriority="high" decoding="async">
  </picture>
  <canvas id="fx"></canvas>
  <div class="sky-scrim"></div>
</div>

<header class="bar">
  <div class="brand">
    <span class="brand-lamp" aria-hidden="true"></span>
    <span class="brand-text">Wish Before It Flies</span>
  </div>
  <div class="bar-actions"><a class="danbi-back" href="../playground/" aria-label="Back to Danbi K-Culture Playground"><span class="danbi-back-ar" aria-hidden="true">←</span><span class="danbi-back-tx">Danbi Playground</span></a>
    <button id="soundBtn" class="icon-btn" type="button" aria-pressed="true" aria-label="Sound on">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.2L12 18.6V5.4L7.2 9.5H4Z"/><path class="wave" d="M15.2 8.4a5 5 0 0 1 0 7.2M17.8 5.9a8.6 8.6 0 0 1 0 12.2"/></svg>
    </button>
    <div class="lang" role="group" aria-label="Language / 언어">
      <button type="button" data-lang="en">EN</button>
      <button type="button" data-lang="ko">KO</button>
    </div>
  </div>
</header>

<main class="stage">
  <section class="hero" id="hero">
    <p class="eyebrow" data-i18n="eyebrow"></p>
    <h1 data-i18n="title"></h1>
    <p class="lede" data-i18n="lede"></p>
    <button class="cta" id="beginBtn" type="button">
      <span data-i18n="cta"></span><span class="cta-arrow" aria-hidden="true">→</span>
    </button>
    <p class="note" data-i18n="note"></p>
    <footer class="foot">
      <a href="https://payhip.com/b/3pOhb" target="_blank" rel="noopener noreferrer" data-i18n="footBook">Korea After Midnight</a>
      <span aria-hidden="true">·</span>
      <a href="https://ko-fi.com/danbilab" target="_blank" rel="noopener noreferrer">Ko-fi</a>
      <span aria-hidden="true">·</span>
      <span data-i18n="footCredit">Danbi Lab, Anseong</span>
    </footer>
  </section>

  <section class="board" aria-labelledby="boardLabel">
    <p class="legend" id="boardLabel" data-i18n="legend"></p>
    <div class="lanterns" id="lanterns" role="group" aria-label="Lanterns"></div>
  </section>

  <div class="hud" id="hud" aria-live="off">
    <span class="hud-item"><span class="hud-k" data-i18n="hudRound">Lantern</span><b><span id="roundNum">1</span><i>/</i><span id="roundTotal">7</span></b></span>
    <span class="hud-sep" aria-hidden="true"></span>
    <span class="hud-item"><span class="hud-k" data-i18n="hudScore">Score</span><b id="scoreNum">0</b></span>
    <span class="hud-sep" aria-hidden="true"></span>
    <span class="hud-item hud-combo" id="comboWrap"><span class="hud-k" data-i18n="hudCombo">Combo</span><b id="comboNum">×1</b></span>
  </div>

  <section class="composer" id="composer">
    <div class="composer-top">
      <p class="hint" id="hint" data-i18n="hintIdle"></p>
      <div class="clock" id="clock" aria-hidden="true"><span id="timeNum">10</span></div>
    </div>
    <div class="field">
      <input id="wishInput" type="text" maxlength="60" autocomplete="off" autocapitalize="sentences" enterkeyhint="done" spellcheck="false" data-i18n-ph="ph" aria-describedby="msg">
      <span class="counter" aria-hidden="true"><span id="chars">0</span>/60</span>
    </div>
    <div class="meter" aria-hidden="true"><i id="meterFill"></i></div>
    <div class="composer-bottom">
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
      <button id="skyBtn" class="ghost" type="button" data-i18n="skyBtn"></button>
    </div>
  </section>
</main>

<div class="floaters" id="floaters" aria-hidden="true"></div>

<div class="overlay" id="result" hidden>
  <div class="result-card glass" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
    <button class="close" id="closeResult" type="button" aria-label="Close">×</button>
    <div class="result-grid">
      <figure class="card-preview">
        <img id="cardImg" alt="Your night sky result card">
      </figure>
      <div class="result-body">
        <p class="eyebrow" data-i18n="resultEyebrow"></p>
        <h2 id="resultTitle"></h2>
        <p class="result-sub" id="resultSub"></p>

        <div class="stats">
          <div><b id="stGood">0</b><span data-i18n="stWishes">wishes kept</span></div>
          <div><b id="stBad">0</b><span data-i18n="stTricks">dokkaebi tricks</span></div>
          <div><b id="stCombo">0</b><span data-i18n="stCombo">best combo</span></div>
          <div><b id="stScore">0</b><span data-i18n="stScore">score</span></div>
        </div>

        <div class="lists">
          <div>
            <h3 data-i18n="wishesHeading">Your words</h3>
            <ul id="goodList"></ul>
          </div>
          <div>
            <h3 data-i18n="flopsHeading">The sky's words</h3>
            <ul id="badList"></ul>
          </div>
        </div>

        <div class="result-actions">
          <button id="downloadBtn" class="cta sm" type="button" data-i18n="download" disabled>Download card</button>
          <button id="againBtn" class="ghost solid" type="button" data-i18n="again">Play again</button>
          <button id="shareBtn" class="ghost" type="button" data-i18n="share">Copy link</button>
        </div>
        <p class="result-foot">
          <a href="https://payhip.com/b/3pOhb" target="_blank" rel="noopener noreferrer" data-i18n="footBook">Korea After Midnight</a>
          <span aria-hidden="true">·</span>
          <a href="https://ko-fi.com/danbilab" target="_blank" rel="noopener noreferrer">Ko-fi</a>
        </p>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><div class="noscript">This little game needs JavaScript. Please turn it on and refresh 🌙</div></noscript>

<script src="assets/app.js?v=18"></script>
</body>
</html>
