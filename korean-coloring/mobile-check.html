<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mobile check (temporary)</title>
<style>
  body{margin:0;background:#2b2b2b;font:12px/1.4 system-ui,sans-serif;color:#eee;padding:10px;display:grid;grid-template-columns:390px 390px;gap:12px;align-items:start}
  figure{margin:0}
  figcaption{margin:0 0 4px;font-weight:600;color:#bbb}
  iframe{width:390px;height:844px;border:0;background:#fff;display:block}
  .small{grid-column:span 2;display:flex;gap:10px}
  .small iframe{width:360px;height:780px}
</style>
</head>
<body>
  <figure><figcaption>390 · studio (tabs + canvas)</figcaption><iframe data-target="#color" data-off="120" src="index.html?11" title="studio"></iframe></figure>
  <figure><figcaption>390 · toolbar + actions</figcaption><iframe data-target=".actions" data-off="-470" src="index.html?12" title="toolbar"></iframe></figure>
  <figure><figcaption>390 · print</figcaption><iframe data-target="#print" data-off="0" src="index.html?13" title="print"></iframe></figure>
  <figure><figcaption>390 · book</figcaption><iframe data-target="#book" data-off="0" src="index.html?14" title="book"></iframe></figure>
  <figure><figcaption>390 · faq + footer</figcaption><iframe data-target=".faq" data-off="120" src="index.html?15" title="faq"></iframe></figure>
  <figure><figcaption>360 · studio</figcaption><iframe data-target="#color" data-off="120" src="index.html?16" title="s360"></iframe></figure>
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        document.querySelectorAll('iframe').forEach(function (f) {
          var sel = f.getAttribute('data-target');
          var off = Number(f.getAttribute('data-off') || 0);
          try {
            var d = f.contentDocument, w = f.contentWindow;
            var t = d.querySelector(sel);
            if (!t) return;
            var y = t.getBoundingClientRect().top + w.scrollY + off;
            w.scrollTo(0, y);
          } catch (e) {}
        });
      }, 2500);
    });
  </script>
</body>
</html>
