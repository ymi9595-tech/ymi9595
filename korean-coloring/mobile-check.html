<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mobile check (temporary)</title>
<style>
  body{margin:0;background:#2b2b2b;font:12px/1.4 system-ui,sans-serif;color:#eee;padding:12px;display:grid;grid-template-columns:390px 390px;gap:14px;align-items:start}
  figure{margin:0}
  figcaption{margin:0 0 5px;font-weight:600;color:#bbb}
  iframe{width:390px;height:844px;border:0;background:#fff;display:block}
  .small{grid-column:span 2;display:flex;gap:10px}
  .small iframe{width:360px;height:780px}
</style>
</head>
<body>
  <figure><figcaption>390 · hero</figcaption><iframe data-s="0" src="index.html?1" title="hero"></iframe></figure>
  <figure><figcaption>390 · studio top</figcaption><iframe data-s="620" src="index.html?2#color" title="studio"></iframe></figure>
  <figure><figcaption>390 · toolbar</figcaption><iframe data-s="1150" src="index.html?3#color" title="toolbar"></iframe></figure>
  <figure><figcaption>390 · print</figcaption><iframe data-s="700" src="index.html?4#print" title="print"></iframe></figure>
  <figure><figcaption>390 · book</figcaption><iframe data-s="0" src="index.html?5#book" title="book"></iframe></figure>
  <figure><figcaption>390 · faq / footer</figcaption><iframe data-s="600" src="index.html?6#book" title="faq"></iframe></figure>
  <div class="small">
    <figure><figcaption>360 · toolbar</figcaption><iframe data-s="1150" src="index.html?7#color" title="t360"></iframe></figure>
    <figure><figcaption>360 · book</figcaption><iframe data-s="0" src="index.html?8#book" title="b360"></iframe></figure>
  </div>
  <script>
    window.addEventListener('load', function () {
      setTimeout(function () {
        document.querySelectorAll('iframe').forEach(function (f) {
          var y = Number(f.getAttribute('data-s') || 0);
          try { f.contentWindow.scrollTo(0, y); } catch (e) {}
        });
      }, 2200);
    });
  </script>
</body>
</html>
