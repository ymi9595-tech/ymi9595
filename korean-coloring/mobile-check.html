<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mobile check (temporary)</title>
<style>
  body{margin:0;background:#2b2b2b;font:12px/1.4 system-ui,sans-serif;color:#eee;padding:10px;display:grid;grid-template-columns:390px 390px;gap:12px;align-items:start}
  figure{margin:0}
  figcaption{margin:0 0 4px;font-weight:600;color:#bbb}
  iframe{width:390px;height:844px;border:0;background:#fff;display:block}
  .small{grid-column:span 2;display:flex;gap:10px}
  .small iframe{width:360px;height:780px}
</style>
</head>
<body>
  <figure><figcaption>390 · studio</figcaption><iframe data-src="index.html" data-target="#color" data-off="120" title="studio"></iframe></figure>
  <figure><figcaption>390 · toolbar + actions</figcaption><iframe data-src="index.html" data-target=".actions" data-off="-470" title="toolbar"></iframe></figure>
  <figure><figcaption>390 · print</figcaption><iframe data-src="index.html" data-target="#print" data-off="0" title="print"></iframe></figure>
  <figure><figcaption>390 · book</figcaption><iframe data-src="index.html" data-target="#book" data-off="0" title="book"></iframe></figure>
  <figure><figcaption>390 · faq + footer</figcaption><iframe data-src="index.html" data-target=".faq" data-off="120" title="faq"></iframe></figure>
  <figure><figcaption>360 · studio</figcaption><iframe data-src="index.html" data-target="#color" data-off="120" title="s360"></iframe></figure>
  <script>
    var v = 'cb=' + Date.now();
    document.querySelectorAll('iframe').forEach(function (f) {
      f.src = f.getAttribute('data-src') + '?' + v;
      f.addEventListener('load', function () {
        setTimeout(function () {
          try {
            var d = f.contentDocument, w = f.contentWindow;
            var t = d.querySelector(f.getAttribute('data-target'));
            if (!t) return;
            w.scrollTo(0, t.getBoundingClientRect().top + w.scrollY + Number(f.getAttribute('data-off') || 0));
          } catch (e) {}
        }, 900);
      });
    });
  </script>
</body>
</html>
