<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mobile check (temporary)</title>
<style>
  body{margin:0;background:#2b2b2b;font:13px/1.4 system-ui,sans-serif;color:#eee;padding:16px;display:flex;gap:18px;align-items:flex-start}
  figure{margin:0}
  figcaption{margin-bottom:8px;font-weight:600}
  iframe{width:390px;height:844px;border:0;background:#fff;display:block;border-radius:8px}
  .small iframe{width:360px;height:780px}
</style>
</head>
<body>
  <figure>
    <figcaption>390 × 844 (iPhone 14)</figcaption>
    <iframe src="index.html?m=390" title="mobile 390"></iframe>
  </figure>
  <figure class="small">
    <figcaption>360 × 780 (Android)</figcaption>
    <iframe src="index.html?m=360" title="mobile 360"></iframe>
  </figure>
</body>
</html>
