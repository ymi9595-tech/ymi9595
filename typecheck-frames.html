<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Type check frames</title>
<style>
  body{margin:0;background:#DDD;font:12px/1 sans-serif}
  .row{background:#999;color:#fff;padding:6px 10px;margin-top:14px}
  iframe{display:block;border:0;background:#fff;margin:0}
</style>
</head>
<body>
<div class="row">1280 · top</div>
<iframe id="d-hero" src="/ymi9595/playground/" width="1280" height="900"></iframe>

<div class="row">1280 · corners</div>
<iframe id="d-play" src="/ymi9595/playground/#play" width="1280" height="900"></iframe>

<div class="row">390 · top</div>
<iframe id="m-hero" src="/ymi9595/playground/" width="390" height="844" scrolling="no"></iframe>

<div class="row">390 · corners</div>
<iframe id="m-play" src="/ymi9595/playground/#play" width="390" height="844" scrolling="no"></iframe>

<div class="row">390 · today</div>
<iframe id="m-today" src="/ymi9595/playground/#today" width="390" height="844" scrolling="no"></iframe>

<div class="row">390 · kitchen</div>
<iframe id="m-kitchen" src="/ymi9595/playground/#kitchen" width="390" height="844" scrolling="no"></iframe>
</body>
</html>
