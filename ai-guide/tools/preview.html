<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ai-guide preview harness</title>
<style>
  html, body { margin: 0; padding: 0; background: #F3EDE6; }
  #frame { border: 0; display: block; background: #fff; }
  body { padding: 8px; }
</style>
</head>
<body>
<iframe id="frame" title="preview"></iframe>
<script>
  var q = new URLSearchParams(location.search);
  var w = parseInt(q.get('w') || '390', 10);
  var h = parseInt(q.get('h') || '844', 10);
  var route = q.get('r') || '';
  var lang = q.get('lang') || 'ko';
  var f = document.getElementById('frame');
  f.style.width = w + 'px';
  f.style.height = h + 'px';

  window.__errs = [];
  window.__check = null;

  f.addEventListener('load', function () {
    try {
      var win = f.contentWindow, doc = f.contentDocument;
      win.addEventListener('error', function (e) {
        window.__errs.push('error: ' + (e.message || '') + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
      });
      win.addEventListener('unhandledrejection', function (e) {
        window.__errs.push('rejection: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason)));
      });
      if (lang === 'en') {
        try { win.localStorage.setItem('dgl-lang', 'en'); } catch (e) {}
        var btn = doc.querySelector('[data-lang="en"]');
        if (btn) btn.click();
      }
      setTimeout(function () {
        var over = [];
        var vw = win.innerWidth;
        if (doc.documentElement.scrollWidth > vw + 1) over.push(['doc', doc.documentElement.scrollWidth, vw]);
        doc.querySelectorAll('body *').forEach(function (el) {
          var b = el.getBoundingClientRect();
          if (b.width > 0 && (b.right > vw + 1.5 || b.left < -1.5)) {
            over.push([el.tagName + '.' + String(el.className || '').slice(0, 40), Math.round(b.left), Math.round(b.right), vw]);
          }
        });
        window.__check = {
          url: f.contentWindow.location.href,
          title: doc.title,
          innerW: vw,
          innerH: win.innerHeight,
          scrollW: doc.documentElement.scrollWidth,
          scrollH: doc.documentElement.scrollHeight,
          prompts: doc.querySelectorAll('.prompt-body').length,
          copyBtns: doc.querySelectorAll('button.copy').length,
          bookRows: doc.querySelectorAll('.sec-book .book-row').length,
          overflow: over.slice(0, 10),
          errors: window.__errs
        };
      }, 1200);
    } catch (e) {
      window.__errs.push('harness: ' + e.message);
    }
  });

  var base = location.href.replace(/tools\/preview\.html.*$/, '');
  f.src = base + '?t=' + Date.now() + (route ? '#' + route : '');
</script>
</body>
</html>
