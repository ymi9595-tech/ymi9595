:root{
  --paper:#F5EEE1; --paper-hi:#FFFBF3; --ink:#2B2521; --ink-soft:#6A5C4E;
  --line:rgba(92,74,54,.20); --line-soft:rgba(92,74,54,.12);
  --accent:#A8623C; --seal:#A8432E;
  --serif:"GowunBatang",Georgia,"Times New Roman",serif;
  --sans:"GowunDodum",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  --hand:"HiMelody",var(--serif);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; padding:0; min-height:100vh; color:var(--ink); font-family:var(--sans);
  background:
    radial-gradient(1100px 620px at 50% -8%, #FFFCF4 0%, rgba(255,252,244,0) 62%),
    radial-gradient(820px 560px at 92% 108%, #F0E3CB 0%, rgba(240,227,203,0) 58%),
    radial-gradient(700px 500px at -6% 82%, #EEE5D2 0%, rgba(238,229,210,0) 60%),
    var(--paper);
  -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  overflow-x:hidden;
}
body::after{
  content:""; position:fixed; inset:0; pointer-events:none; z-index:0; opacity:.42; mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='170' height='170'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='170' height='170' filter='url(%23n)' opacity='.30'/%3E%3C/svg%3E");
}
.shell{position:relative; z-index:1}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

/* ---------- header ---------- */
.topbar{
  display:flex; align-items:center; justify-content:space-between; gap:16px;
  max-width:1180px; margin:0 auto; padding:20px clamp(15px,4vw,42px) 4px;
}
.brand{display:flex; align-items:center; gap:11px; min-width:0}
.sealmark{
  width:39px; height:39px; border-radius:9px; flex:none; background:var(--seal); color:#FDF6EC;
  display:grid; place-items:center; font-family:var(--serif); font-size:14.5px; line-height:1;
  letter-spacing:-.3px; box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.30), inset 0 -2px 0 rgba(0,0,0,.10), 0 2px 6px -2px rgba(120,60,40,.45);
}
.brandname{font-family:var(--serif); font-size:18px; letter-spacing:.02em; line-height:1.15}
.brandsub{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-soft); margin-top:3px}
.lang{display:flex; padding:3px; border:1px solid var(--line); border-radius:999px; background:rgba(255,255,255,.55); flex:none}
.lang button{
  border:0; background:transparent; border-radius:999px; padding:7px 13px; cursor:pointer;
  font-family:var(--sans); font-size:11px; letter-spacing:.13em; color:var(--ink-soft); transition:.18s;
}
.lang button.on{background:var(--ink); color:#FBF5E9}

/* ---------- layout ---------- */
main{
  max-width:1180px; margin:0 auto; padding:10px clamp(14px,3.6vw,42px) 30px;
  display:grid; grid-template-columns:minmax(0,410px) minmax(0,1fr);
  gap:clamp(22px,4.6vw,56px); align-items:start;
}
.leftcol{min-width:0}
.panel{min-width:0; max-width:620px; display:flex; flex-direction:column; gap:20px; padding-top:2px}
@media (max-width:900px){
  main{grid-template-columns:1fr; gap:24px; padding-top:6px}
  .leftcol{order:1} .panel{order:2}
}

/* ---------- deck chips ---------- */
.chips{display:flex; gap:7px; flex-wrap:wrap; margin:2px 0 13px}
.chip{
  font-family:var(--sans); font-size:12.5px; padding:8px 12px; border-radius:999px; cursor:pointer;
  border:1px solid var(--line); background:rgba(255,255,255,.52); color:var(--ink-soft);
  transition:background .18s,border-color .18s,color .18s,transform .18s; white-space:nowrap;
}
.chip:hover{border-color:rgba(92,74,54,.42); transform:translateY(-1px)}
.chip.on{background:var(--ink); border-color:var(--ink); color:#FBF5E9}
.chip:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- card ---------- */
.stage{position:relative; width:100%; max-width:410px; margin:0 auto; perspective:1500px}
.card{position:relative; width:100%; aspect-ratio:2/3; cursor:pointer; outline:none}
.card-inner{
  position:absolute; inset:0; transform-style:preserve-3d;
  transition:transform 1.02s cubic-bezier(.22,.9,.16,1);
}
.card.flipped .card-inner{transform:rotateY(180deg)}
.face{
  position:absolute; inset:0; border-radius:13px; overflow:hidden;
  backface-visibility:hidden; -webkit-backface-visibility:hidden;
  box-shadow:0 22px 46px -22px rgba(58,40,24,.52), 0 4px 14px -8px rgba(58,40,24,.35), inset 0 0 0 1px rgba(255,255,255,.35);
}
.face.front{transform:rotateY(180deg); background:#F7EFE0}
.face.front canvas{display:block; width:100%; height:100%}
.card:focus-visible .face{box-shadow:0 0 0 2px var(--accent),0 22px 46px -22px rgba(58,40,24,.52)}

/* card back */
.cback{position:absolute; inset:0; display:grid; place-items:center; overflow:hidden;
  background:radial-gradient(circle at 50% 40%, rgba(255,255,255,.10), rgba(255,255,255,0) 62%),

}
.cbpattern{position:absolute; inset:15px; border-radius:8px; border:1px solid var(--cline,rgba(243,233,214,.30));

}

.cbcenter{position:relative; text-align:center; padding:0 24px}

  position:relative;
}
.cbstamp::before{content:""; position:absolute; inset:6px; border-radius:50%; border:1px solid var(--caccent,rgba(243,233,214,.25))}
.cbtitle{font-size:9.5px; letter-spacing:.30em; text-transform:uppercase; color:var(--caccent,#D9C8A4); margin-bottom:9px}
.cbhint{font-family:var(--serif); font-size:15px; opacity:.9; animation:breathe 3.4s ease-in-out infinite}

.card.flipped .cbhint{animation:none}

.controls{display:flex; gap:9px; margin-top:17px; max-width:410px; margin-left:auto; margin-right:auto}
.btn{

}
.btn:hover{transform:translateY(-1px); box-shadow:0 10px 20px -14px rgba(58,40,24,.75)}
.btn:active{transform:translateY(0)}
.btn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.btn.primary{flex:1; background:var(--ink); border-color:var(--ink); color:#FBF5E9}
.btn.primary:hover{background:#3A322B}
.btn svg{width:15px; height:15px; flex:none}
.btn.playing{background:#EFE3CD; border-color:var(--line)}

/* ---------- panel ---------- */
.pblock{border-top:1px solid var(--line-soft); padding-top:15px}
.pblock:first-child{border-top:0; padding-top:0}
.pblock h3{

}
.swatches{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:9px}
.sw{border:0; padding:0; background:none; cursor:pointer; font-family:var(--sans); text-align:left}
.sw .swatch{
  display:block; height:56px; border-radius:8px; border:1px solid rgba(92,74,54,.16); position:relative; overflow:hidden;

}
.sw:hover .swatch{transform:translateY(-2px)}
.sw.on .swatch{box-shadow:0 0 0 2px var(--paper), 0 0 0 3.6px var(--accent)}
.sw .swname{display:block; margin-top:6px; font-size:10.5px; color:var(--ink-soft); line-height:1.25}
.sw.on .swname{color:var(--ink)}
.swatch i{position:absolute; inset:7px; border:1px solid; opacity:.55; border-radius:3px; display:block}

.note{margin:0; font-family:var(--serif); font-size:15px; line-height:1.78; color:#4A4038; letter-spacing:.002em}

.wko{font-family:var(--serif); font-size:19px; letter-spacing:.04em}
.wro{font-size:12px; color:var(--ink-soft)}
.wen{display:block; margin-top:4px; font-family:var(--serif); font-size:13.5px; color:#544A41; line-height:1.5}

.pblock.empty{opacity:.42}

.luckyrow{display:flex; align-items:center; gap:11px; flex-wrap:wrap}
.luckyitem{font-family:var(--serif); font-size:16.5px; line-height:1.4}
.luckynum{

  background:rgba(255,255,255,.5);
}
.saves{display:flex; flex-direction:column; gap:8px}
.savebtn{
  display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%;

  transition:transform .16s, box-shadow .16s, background .16s;
}
.savebtn:hover{transform:translateY(-1px); box-shadow:0 12px 22px -16px rgba(58,40,24,.85); background:rgba(255,255,255,.8)}
.savebtn:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
.savebtn b{font-weight:400; font-size:13.5px}
.savebtn small{font-size:10.5px; color:var(--ink-soft); letter-spacing:.03em; white-space:nowrap}
.savebtn svg{width:16px;height:16px;flex:none;opacity:.75}
.savebtn > span{display:flex; align-items:center; gap:9px}
.copyrow{display:flex; gap:8px; margin-top:3px}
.copyrow .btn{flex:1; font-size:12px; padding:10px 8px}

/* ---------- footer ---------- */
footer{
  max-width:1180px; margin:0 auto; padding:26px clamp(15px,4vw,42px) 46px;
  border-top:1px solid var(--line-soft); text-align:center;
}
.footmark{
  width:32px; height:32px; margin:0 auto 10px; border-radius:7px; background:rgba(168,67,46,.09);
  border:1px solid rgba(168,67,46,.28); color:var(--seal); display:grid; place-items:center;
  font-family:var(--serif); font-size:12px; letter-spacing:-.3px;
}
.footbrand{font-family:var(--serif); font-size:14px; letter-spacing:.16em; text-transform:uppercase; margin:0 0 8px}
.footdesc{max-width:460px; margin:0 auto 10px; font-family:var(--serif); font-size:12.5px; line-height:1.8; color:#6C5F52}
.foothow{max-width:520px; margin:0 auto; font-size:11px; line-height:1.8; color:#8B7C6C; letter-spacing:.01em}

/* ---------- toast ---------- */
.toast{
  position:fixed; left:50%; bottom:26px; transform:translate(-50%,16px); z-index:50;
  background:var(--ink); color:#FBF5E9; font-size:12.5px; padding:11px 18px; border-radius:999px;
  box-shadow:0 16px 30px -16px rgba(0,0,0,.6); opacity:0; pointer-events:none;
  transition:opacity .22s, transform .22s; letter-spacing:.02em; max-width:88vw; text-align:center;
}
.toast.show{opacity:1; transform:translate(-50%,0)}

@media (max-width:400px){

  .brandname{font-size:17px}
}

var HASHTAGS = '#KoreanQuote #DailyFortune #KoreanVibes #DanbiLab';

/* ---------- state ---------- */
var state = { deck:'love', design:'blossom', entry:null, lang:'en', speaking:false };

var $ = function(id){ return document.getElementById(id); };
var card = $('card'), cardCanvas = $('cardCanvas'), cback = $('cback');

function t(k){ return STR[state.lang][k] || STR.en[k] || k; }

/* ---------- init ---------- */
function boot(){
  buildChips();
  buildSwatches();
  applyDesignToBack();
  updateLabels();
  bind();
  renderPanel();
  loadFonts().then(function(){
    renderCard();
    renderCard(); // second pass once fonts are certainly ready
  });
}

function loadFonts(){
  if(!document.fonts || !document.fonts.load) return Promise.resolve();
  return Promise.all(['GowunBatang','GowunDodum','HiMelody'].map(function(f){
    return document.fonts.load('40px "' + f + '"', '\uAC00\uB098\uB2E4 ABC 123 \u00B7').catch(function(){});
  })).then(function(){ return document.fonts.ready; }).catch(function(){});
}

/* ---------- chips / swatches ---------- */
function buildChips(){
  var box = $('chips');
  box.innerHTML = '';
  var ids = ['love','calm','courage','seoul'];
  ids.forEach(function(id){
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'chip' + (state.deck === id ? ' on' : '');
    b.textContent = DECKS[id][state.lang];
    b.setAttribute('aria-pressed', state.deck === id ? 'true' : 'false');
    b.addEventListener('click', function(){ setDeck(id); });
    box.appendChild(b);
  });
  var all = document.createElement('button');
  all.type = 'button'; all.className = 'chip' + (state.deck === 'all' ? ' on' : '');
  all.textContent = t('allDecks');
  all.setAttribute('aria-pressed', state.deck === 'all' ? 'true' : 'false');
  all.addEventListener('click', function(){ setDeck('all'); });
  box.appendChild(all);
}

function buildSwatches(){
  var box = $('swatches');
  box.innerHTML = '';
  Object.keys(DESIGNS).forEach(function(key){
    var d = DESIGNS[key];
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'sw' + (state.design === key ? ' on' : '');
    b.setAttribute('aria-pressed', state.design === key ? 'true' : 'false');
    var sw = document.createElement('span');
    sw.className = 'swatch';
    sw.style.background = 'linear-gradient(150deg,' + d.bg1 + ',' + d.bg2 + ')';
    var inner = document.createElement('i');
    inner.style.borderColor = d.accent;
    sw.appendChild(inner);
    var nm = document.createElement('span');
    nm.className = 'swname';
    nm.textContent = d[state.lang];
    b.appendChild(sw); b.appendChild(nm);
    b.addEventListener('click', function(){ setDesign(key); });
    box.appendChild(b);
  });
}

function setDeck(id){
  state.deck = id;
  if(id !== 'all'){ state.design = DECKS[id].design; }
  buildChips(); buildSwatches(); applyDesignToBack();
  if(state.entry){
    state.entry = pickEntry(state.entry);
    renderAll();
  }
  renderCard();
}

function setDesign(key){
  state.design = key;
  buildSwatches(); applyDesignToBack(); renderAll();
}

/* ---------- picking ---------- */
function pool(){
  if(state.deck === 'all') return CARDS.slice();
  return CARDS.filter(function(c){ return c.th === state.deck; });
}

function pickEntry(avoid){
  var p = pool();
  if(p.length < 2) return p[0];
  var out = p[Math.floor(Math.random() * p.length)];
  var guard = 0;
  while(avoid && out === avoid && guard++ < 20){ out = p[Math.floor(Math.random() * p.length)]; }
  return out;
}

/* ---------- labels ---------- */
function updateLabels(){
  document.documentElement.lang = state.lang;
  Array.prototype.forEach.call(document.querySelectorAll('[data-i18n]'), function(el){
    var k = el.getAttribute('data-i18n');
    if(STR[state.lang][k]) el.textContent = STR[state.lang][k];
  });
  $('drawLabel').textContent = state.entry ? t('redraw') : t('draw');
  $('listenLabel').textContent = state.speaking ? t('listening') : t('listen');
  $('cbhint').textContent = t('tap');
  Array.prototype.forEach.call(document.querySelectorAll('.lang button'), function(b){
    var on = b.getAttribute('data-lang') === state.lang;
    b.classList.toggle('on', on);
    b.setAttribute('aria-pressed', on ? 'true' : 'false');
  });
  card.setAttribute('aria-label', state.entry ? t('redraw') : t('draw'));
}

function applyDesignToBack(){
  var d = DESIGNS[state.design];
  cback.style.setProperty('--cbg1', d.back1);
  cback.style.setProperty('--cbg2', d.back2);
  cback.style.setProperty('--cink', d.backInk);
  cback.style.setProperty('--caccent', d.backAccent);
  cback.style.setProperty('--cline', hexA(d.backAccent, 0.30));
  cback.style.setProperty('--cdot', hexA(d.backAccent, 0.18));
}

/* ---------- panel ---------- */
function renderAll(){
  renderCard(); renderPanel();

}

function renderPanel(){
  var drawn = !!state.entry;

function luckyNumber(e){
  var idx = CARDS.indexOf(e), d = new Date();
  return ((idx * 7 + d.getDate() + d.getMonth() * 3) % 9) + 1;

/* ============================================================
   CARD RENDERER
   ============================================================ */
var FAMS = { serif:'"GowunBatang", serif', sans:'"GowunDodum", sans-serif', hand:'"HiMelody", cursive' };

function hexA(hex, a){
  var h = hex.replace('#','');
  if(h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  var r = parseInt(h.substring(0,2),16), g = parseInt(h.substring(2,4),16), b = parseInt(h.substring(4,6),16);
  return 'rgba(' + r + ',' + g + ',' + b + ',' + a + ')';
}

/* deterministic noise tile */
var _noise = null;
function noiseTile(){
  if(_noise) return _noise;
  var size = 180, c = document.createElement('canvas');
  c.width = c.height = size;
  var x = c.getContext('2d'), img = x.createImageData(size, size);
  var seed = 1234567;
  function rnd(){ seed = (seed * 1664525 + 1013904223) % 4294967296; return seed / 4294967296; }
  for(var i = 0; i < img.data.length; i += 4){
    var v = 118 + Math.floor(rnd() * 60);
    img.data[i] = v; img.data[i+1] = v; img.data[i+2] = v;
    img.data[i+3] = Math.floor(rnd() * 150);
  }
  x.putImageData(img, 0, 0);
  _noise = c;
  return c;
}

function tracked(ctx, text, cx, y, track, align){
  var chars = Array.from(text), widths = [], total = 0, i;
  for(i = 0; i < chars.length; i++){ var w = ctx.measureText(chars[i]).width; widths.push(w); total += w; }
  total += track * (chars.length - 1);
  var x = align === 'left' ? cx : (align === 'right' ? cx - total : cx - total / 2);
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  for(i = 0; i < chars.length; i++){ ctx.fillText(chars[i], x, y); x += widths[i] + track; }
  return total;
}

function wrapLines(ctx, text, maxW){
  var words = String(text).split(' '), lines = [], line = '';
  for(var i = 0; i < words.length; i++){
    var test = line ? line + ' ' + words[i] : words[i];
    if(ctx.measureText(test).width <= maxW || !line){ line = test; }
    else { lines.push(line); line = words[i]; }
  }
  if(line) lines.push(line);
  return lines;
}

/* even line lengths: DP over word breaks, minimising width variance */
var _penalized = false;
function balanceLines(ctx, text, maxW){
  _penalized = false;
  var words = String(text).split(' ');
  if(words.length < 2) return [String(text)];
  var greedy = wrapLines(ctx, text, maxW);
  var n = greedy.length;
  if(n < 2) return greedy;
  var N = words.length, i, j, l;
  var widths = [], space = ctx.measureText(' ').width, total = 0;
  for(i = 0; i < N; i++){ widths.push(ctx.measureText(words[i]).width); total += widths[i]; }
  total += space * (N - 1);
  if(n > Math.min(3, N)) n = Math.min(3, N);
  var target = total / n, INF = 1e12;
  var best = [], from = [];
  for(i = 0; i <= N; i++){
    best.push(new Array(n + 1)); from.push(new Array(n + 1));
    for(l = 0; l <= n; l++){ best[i][l] = INF; from[i][l] = -1; }
  }
  best[0][0] = 0;
  for(l = 1; l <= n; l++){
    for(i = 1; i <= N; i++){
      for(j = 0; j < i; j++){
        if(best[j][l-1] >= INF) continue;
        var w = 0, k;
        for(k = j; k < i; k++) w += widths[k];
        w += space * (i - j - 1);
        if(w > maxW + 0.5) continue;
        var c = best[j][l-1] + (w - target) * (w - target);
        /* a lone short word stranded mid-line reads badly in Korean */
        if(!(i === N && l === n) && (i - j) === 1 && w < target * 0.66) c += 1e6;
        if(c < best[i][l]){ best[i][l] = c; from[i][l] = j; }
      }
    }
  }
  if(best[N][n] >= INF) return greedy;
  _penalized = best[N][n] >= 1e6;
  var out = [];
  i = N; l = n;
  while(l > 0){ j = from[i][l]; out.unshift(words.slice(j, i).join(' ')); i = j; l--; }
  return out;
}

function fitBlock(ctx, text, fam, sizes, maxW, maxLines){
  var loose = null;
  for(var i = 0; i < sizes.length; i++){
    ctx.font = sizes[i] + 'px ' + FAMS[fam];
    var lines = balanceLines(ctx, text, maxW);
    if(lines.length <= maxLines){
      if(!_penalized) return { size:sizes[i], lines:lines };
      if(!loose) loose = { size:sizes[i], lines:lines };
    }
  }
  if(loose) return loose;
  var last = sizes[sizes.length - 1];
  ctx.font = last + 'px ' + FAMS[fam];
  return { size:last, lines:balanceLines(ctx, text, maxW) };
}

function roundRect(ctx, x, y, w, h, r){
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y); ctx.quadraticCurveTo(x + w, y, x + w, y + r);
  ctx.lineTo(x + w, y + h - r); ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
  ctx.lineTo(x + r, y + h); ctx.quadraticCurveTo(x, y + h, x, y + h - r);
  ctx.lineTo(x, y + r); ctx.quadraticCurveTo(x, y, x + r, y);
  ctx.closePath();
}

/* ---------- ornaments ---------- */
function drawOrnament(ctx, kind, cx, cy, r, d, s){
  var acc = d.accent;
  ctx.save();
  ctx.lineCap = 'round';
  ctx.lineJoin = 'round';

  if(kind === 'sun'){
    /* a small sun over a quiet horizon */
    var R = r * 0.52;
    ctx.fillStyle = hexA(acc, 0.26);
    ctx.beginPath(); ctx.arc(cx, cy - r*0.10, R, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = hexA(acc, 0.48); ctx.lineWidth = 1.3*s;
    ctx.beginPath(); ctx.arc(cx, cy - r*0.10, R, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = hexA(acc, 0.42); ctx.lineWidth = 1.2*s;
    ctx.beginPath(); ctx.moveTo(cx - r*1.35, cy + r*0.62); ctx.lineTo(cx + r*1.35, cy + r*0.62); ctx.stroke();
    ctx.strokeStyle = hexA(acc, 0.22); ctx.lineWidth = 1*s;
    ctx.beginPath();
    ctx.moveTo(cx - r*0.72, cy + r*0.86); ctx.lineTo(cx - r*0.24, cy + r*0.86);
    ctx.moveTo(cx + r*0.24, cy + r*0.86); ctx.lineTo(cx + r*0.72, cy + r*0.86);
    ctx.stroke();
  }
  else if(kind === 'crescent'){
    ctx.fillStyle = hexA(acc, 0.40);
    ctx.beginPath();
    ctx.arc(cx - r*0.10, cy, r*0.62, Math.PI*0.42, Math.PI*1.58, false);
    ctx.arc(cx + r*0.26, cy, r*0.56, Math.PI*1.58, Math.PI*0.42, true);
    ctx.closePath(); ctx.fill();
    var sp = [[0.66,-0.54,0.15],[-0.56,-0.64,0.10],[0.80,0.30,0.085],[-0.70,0.44,0.065]];
    for(var q2 = 0; q2 < sp.length; q2++){
      var px = cx + sp[q2][0]*r, py = cy + sp[q2][1]*r, sz = sp[q2][2]*r;
      ctx.fillStyle = hexA(acc, 0.55);
      ctx.beginPath();
      ctx.moveTo(px, py - sz*1.7);
      ctx.quadraticCurveTo(px, py, px + sz*1.7, py);
      ctx.quadraticCurveTo(px, py, px, py + sz*1.7);
      ctx.quadraticCurveTo(px, py, px - sz*1.7, py);
      ctx.quadraticCurveTo(px, py, px, py - sz*1.7);
      ctx.fill();
    }
  }
  else if(kind === 'leaf'){
    var P0 = {x:cx - r*0.94, y:cy + r*0.82}, P1 = {x:cx - r*0.36, y:cy + r*0.24},
        P2 = {x:cx + r*0.12, y:cy - r*0.14}, P3 = {x:cx + r*0.90, y:cy - r*0.74};
    ctx.strokeStyle = hexA(acc, 0.50); ctx.lineWidth = 1.5*s;
    ctx.beginPath(); ctx.moveTo(P0.x, P0.y);
    ctx.bezierCurveTo(P1.x, P1.y, P2.x, P2.y, P3.x, P3.y); ctx.stroke();
    var ts = [0.18, 0.36, 0.55, 0.74], t, mt, px, py, dx, dy, ang;
    for(var j = 0; j < ts.length; j++){
      t = ts[j]; mt = 1 - t;
      px = mt*mt*mt*P0.x + 3*mt*mt*t*P1.x + 3*mt*t*t*P2.x + t*t*t*P3.x;
      py = mt*mt*mt*P0.y + 3*mt*mt*t*P1.y + 3*mt*t*t*P2.y + t*t*t*P3.y;
      dx = 3*mt*mt*(P1.x - P0.x) + 6*mt*t*(P2.x - P1.x) + 3*t*t*(P3.x - P2.x);
      dy = 3*mt*mt*(P1.y - P0.y) + 6*mt*t*(P2.y - P1.y) + 3*t*t*(P3.y - P2.y);
      ang = Math.atan2(dy, dx) + (j % 2 === 0 ? 1 : -1) * Math.PI * 0.40;
      ctx.save(); ctx.translate(px, py); ctx.rotate(ang);
      ctx.fillStyle = hexA(acc, 0.24); ctx.strokeStyle = hexA(acc, 0.42); ctx.lineWidth = 0.9*s;
      ctx.beginPath(); ctx.ellipse(r*0.17, 0, r*0.17, r*0.085, 0, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
  }
  else if(kind === 'blossom'){
    for(var k = 0; k < 5; k++){
      var a = -Math.PI/2 + k*(Math.PI*2/5);
      var bx = cx + Math.cos(a)*r*0.50, by = cy + Math.sin(a)*r*0.50;
      ctx.save(); ctx.translate(bx, by); ctx.rotate(a + Math.PI/2);
      ctx.fillStyle = hexA(acc, 0.30); ctx.strokeStyle = hexA(acc, 0.44); ctx.lineWidth = 1*s;
      ctx.beginPath(); ctx.ellipse(0, 0, r*0.36, r*0.27, 0, 0, Math.PI*2);
      ctx.fill(); ctx.stroke();
      ctx.restore();
    }
    ctx.fillStyle = hexA(acc, 0.55);
    ctx.beginPath(); ctx.arc(cx, cy, r*0.085, 0, Math.PI*2); ctx.fill();
  }
  ctx.restore();
}

function drawSeal(ctx, cx, cy, half, d, s){
  ctx.save();
  ctx.fillStyle = hexA(d.seal, 0.93);
  roundRect(ctx, cx - half, cy - half, half*2, half*2, 5*s); ctx.fill();
  ctx.strokeStyle = hexA('#FFFFFF', 0.32); ctx.lineWidth = 1.1*s;
  roundRect(ctx, cx - half + 5*s, cy - half + 5*s, half*2 - 10*s, half*2 - 10*s, 3*s); ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,0.95)';
  ctx.font = (half*0.60) + 'px ' + FAMS.serif;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('단', cx, cy - half*0.34);
  ctx.fillText('비', cx, cy + half*0.36);
  ctx.restore();
}

var WD_EN = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
var WD_KO = ['일요일','월요일','화요일','수요일','목요일','금요일','토요일'];

function dateLine(lang){
  var d = new Date();
  if(lang === 'ko'){
    return d.getFullYear() + '년 ' + (d.getMonth()+1) + '월 ' + d.getDate() + '일 ' + WD_KO[d.getDay()];
  }
  var mm = ('0' + (d.getMonth()+1)).slice(-2), dd = ('0' + d.getDate()).slice(-2);
  return d.getFullYear() + '.' + mm + '.' + dd + '  \u00B7  ' + WD_EN[d.getDay()];
}

function renderCard(){
  renderCardTo(cardCanvas, 1000, 1500);
}

function renderCardTo(canvas, w, h){
  var e = state.entry;
  if(!e) return;
  var d = DESIGNS[state.design];
  var ko = state.lang === 'ko';
  var s = w / 1000;

  canvas.width = w; canvas.height = h;
  var ctx = canvas.getContext('2d');

  /* --- background --- */
  var g = ctx.createLinearGradient(0, -h*0.1, w*0.5, h);
  g.addColorStop(0, d.bg1); g.addColorStop(1, d.bg2);
  ctx.fillStyle = g; ctx.fillRect(0, 0, w, h);

  var rg = ctx.createRadialGradient(w*0.5, h*0.26, 0, w*0.5, h*0.26, w*0.92);
  rg.addColorStop(0, hexA('#FFFFFF', d.dark ? 0.07 : 0.30));
  rg.addColorStop(1, hexA('#FFFFFF', 0));
  ctx.fillStyle = rg; ctx.fillRect(0, 0, w, h);

  /* grain */
  ctx.save();
  ctx.globalAlpha = d.grain;
  ctx.globalCompositeOperation = d.dark ? 'overlay' : 'multiply';
  ctx.fillStyle = ctx.createPattern(noiseTile(), 'repeat');
  ctx.fillRect(0, 0, w, h);
  ctx.restore();

  /* vignette */
  var vg = ctx.createRadialGradient(w*0.5, h*0.5, Math.min(w,h)*0.30, w*0.5, h*0.5, Math.max(w,h)*0.78);
  vg.addColorStop(0, hexA(d.dark ? '#000000' : '#6B4E33', 0));
  vg.addColorStop(1, hexA(d.dark ? '#000000' : '#6B4E33', d.dark ? 0.34 : 0.10));
  ctx.fillStyle = vg; ctx.fillRect(0, 0, w, h);

  /* --- frame --- */
  ctx.strokeStyle = hexA(d.accent, d.dark ? 0.58 : 0.62); ctx.lineWidth = 1.6*s;
  roundRect(ctx, 36*s, 36*s, w - 72*s, h - 72*s, 6*s); ctx.stroke();
  ctx.strokeStyle = hexA(d.accent, d.dark ? 0.30 : 0.34); ctx.lineWidth = 1*s;
  roundRect(ctx, 46*s, 46*s, w - 92*s, h - 92*s, 4*s); ctx.stroke();

  /* corner ticks */
  var tick = 14*s, ix = 46*s, iy = 46*s, ex = w - 46*s, ey = h - 46*s;
  ctx.strokeStyle = hexA(d.accent, 0.55); ctx.lineWidth = 1.4*s;
  [[ix,iy,1,1],[ex,iy,-1,1],[ix,ey,1,-1],[ex,ey,-1,-1]].forEach(function(c){
    ctx.beginPath();
    ctx.moveTo(c[0] + c[2]*tick, c[1]); ctx.lineTo(c[0], c[1]); ctx.lineTo(c[0], c[1] + c[3]*tick);
    ctx.stroke();
  });

  /* --- top: brand --- */
  ctx.font = (19*s) + 'px ' + FAMS.sans;
  ctx.fillStyle = hexA(d.accent, 0.95);
  tracked(ctx, 'DANBI LAB', w/2, 100*s, 9*s);

  ctx.strokeStyle = hexA(d.accent, 0.42); ctx.lineWidth = 1*s;
  ctx.beginPath(); ctx.moveTo(w/2 - 22*s, 138*s); ctx.lineTo(w/2 + 22*s, 138*s); ctx.stroke();

  /* theme */
  ctx.font = (24*s) + 'px ' + FAMS.sans;
  ctx.fillStyle = hexA(d.dark ? d.sub : d.ink, d.dark ? 0.92 : 0.74);
  tracked(ctx, DECKS[e.th].ko, w/2, 180*s, 6.5*s);

  /* ornament */
  drawOrnament(ctx, d.ornament, w/2, 276*s, 44*s, d, s);

  /* --- middle block --- */
  var maxW = w * 0.715;
  var topZone = 385*s, botZone = h - 330*s;
  var ts = (h / w) > 1.6 ? 1.10 : 1;   /* taller story framing gets slightly larger type */

  var mainSizes = [104,96,90,84,78,72,66,60].map(function(v){ return v*s*ts; });
  var main = fitBlock(ctx, e.ko, 'serif', mainSizes, maxW, 3);
  var mainLH = main.size * 1.44;

  ctx.font = (24*s) + 'px ' + FAMS.sans;
  var roSize = 25*s*ts;
  ctx.font = roSize + 'px ' + FAMS.sans;
  var roLines = balanceLines(ctx, e.ro, w * 0.78);
  var roLH = roSize * 1.62;

  var enSizes = [35,32,30,28].map(function(v){ return v*s*ts; });
  var en = fitBlock(ctx, e.en, 'serif', enSizes, w * 0.70, 3);
  var enLH = en.size * 1.55;

  var labelH = 34*s*ts, divH = 54*s*ts, gapRoTop = 16*s*ts, gapEn = 28*s*ts;
  var total = labelH + main.lines.length*mainLH + divH + roLines.length*roLH + gapEn + en.lines.length*enLH;
  var y = topZone + Math.max(0, (botZone - topZone - total) * 0.45);

  /* "today's line" label */
  if(ko){
    ctx.font = (34*s) + 'px ' + FAMS.hand;
    ctx.fillStyle = hexA(d.ink, d.dark ? 0.80 : 0.60);
    tracked(ctx, '오늘의 문장', w/2, y + labelH*0.45, 4*s);
  } else {
    ctx.font = (17*s) + 'px ' + FAMS.sans;
    ctx.fillStyle = hexA(d.accent, 0.80);
    tracked(ctx, 'TODAY\u2019S LINE', w/2, y + labelH*0.45, 6.5*s);
  }
  y += labelH;

  /* main korean */
  var inkColor = hexA(d.ink, d.dark ? 0.98 : 0.94);
  ctx.fillStyle = inkColor;
  ctx.font = main.size + 'px ' + FAMS.serif;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(var i = 0; i < main.lines.length; i++){
    ctx.fillText(main.lines[i], w/2, y + i*mainLH + mainLH*0.5);
  }
  y += main.lines.length*mainLH;

  /* divider */
  var dy = y + divH*0.46;
  ctx.strokeStyle = hexA(d.accent, 0.50); ctx.lineWidth = 1*s;
  ctx.beginPath(); ctx.moveTo(w/2 - 88*s, dy); ctx.lineTo(w/2 - 12*s, dy);
  ctx.moveTo(w/2 + 12*s, dy); ctx.lineTo(w/2 + 88*s, dy); ctx.stroke();
  ctx.save(); ctx.translate(w/2, dy); ctx.rotate(Math.PI/4);
  ctx.fillStyle = hexA(d.accent, 0.62); ctx.fillRect(-2.6*s, -2.6*s, 5.2*s, 5.2*s); ctx.restore();
  y += divH;

  /* romanization */
  y += gapRoTop;
  ctx.fillStyle = hexA(d.sub, 0.95);
  ctx.font = roSize + 'px ' + FAMS.sans;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for(var j = 0; j < roLines.length; j++){
    ctx.fillText(roLines[j], w/2, y + j*roLH + roLH*0.5);
  }
  y += roLines.length*roLH + gapEn;

  /* english */
  ctx.fillStyle = hexA(d.ink, d.dark ? 0.86 : 0.84);
  ctx.font = en.size + 'px ' + FAMS.serif;
  for(var k2 = 0; k2 < en.lines.length; k2++){
    ctx.fillText(en.lines[k2], w/2, y + k2*enLH + enLH*0.5);
  }

  /* --- bottom --- */
  var luckyLabelY = h - 258*s, luckyY = h - 213*s, ruleY = h - 160*s, dateY = h - 120*s;

  ctx.font = (15*s) + 'px ' + FAMS.sans;
  ctx.fillStyle = hexA(d.accent, 0.90);
  tracked(ctx, ko ? '행운의 아이템' : 'LUCKY CHARM', w/2, luckyLabelY, 5*s);

  ctx.font = (27*s) + 'px ' + FAMS.serif;
  ctx.fillStyle = hexA(d.ink, 0.88);
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  var luckyTxt = ko ? e.luckyKo : e.luckyEn;
  var luckyLines = balanceLines(ctx, luckyTxt, w * 0.62);
  ctx.fillText(luckyLines[0], w/2, luckyY);

  ctx.strokeStyle = hexA(d.accent, 0.34); ctx.lineWidth = 1*s;
  ctx.beginPath(); ctx.moveTo(w/2 - 40*s, ruleY); ctx.lineTo(w/2 + 40*s, ruleY); ctx.stroke();

  ctx.font = (21*s) + 'px ' + FAMS.sans;
  ctx.fillStyle = hexA(d.sub, 0.92);
  tracked(ctx, dateLine(state.lang), w/2, dateY, 1.2*s);

  /* seal */
  drawSeal(ctx, w - 108*s, h - 112*s, 37*s, d, s);

  /* bottom-left micro mark: collectible numbering */
  ctx.font = (14*s) + 'px ' + FAMS.sans;
  ctx.fillStyle = hexA(d.sub, 0.70);
  var idx = CARDS.indexOf(e) + 1;
  var num = 'No. ' + (idx < 10 ? '0' + idx : idx) + ' / ' + CARDS.length;
  tracked(ctx, num, 58*s, h - 112*s, 1.4*s, 'left');
}

/* ============================================================
   INTERACTION
   ============================================================ */
function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }

var busy = false;
async function drawCard(){
  if(busy) return;
  busy = true;
  try{
    if(!state.entry){
      state.entry = pickEntry(null);
      renderAll();
      await wait(40);
      card.classList.add('flipped');
      await wait(1000);
    } else {
      card.classList.remove('flipped');
      await wait(430);
      state.entry = pickEntry(state.entry);
      renderAll();
      await wait(60);
      card.classList.add('flipped');
      await wait(1000);
    }
  } finally { busy = false; }
}

function speak(){
  if(!('speechSynthesis' in window)){ toast(t('noSpeech')); return; }
  if(!state.entry){ toast(t('draw')); return; }
  try{
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(state.entry.ko);
    u.lang = 'ko-KR'; u.rate = 0.82; u.pitch = 1.02;
    var voices = window.speechSynthesis.getVoices() || [];
    for(var i = 0; i < voices.length; i++){
      if(/^ko/i.test(voices[i].lang)){ u.voice = voices[i]; break; }
    }
    u.onstart = function(){ state.speaking = true; updateLabels(); $('listenBtn').classList.add('playing'); };
    u.onend = u.onerror = function(){ state.speaking = false; updateLabels(); $('listenBtn').classList.remove('playing'); };
    window.speechSynthesis.speak(u);
  } catch(err){ toast(t('noSpeech')); }
}

function fileDate(){
  var d = new Date(), mm = ('0'+(d.getMonth()+1)).slice(-2), dd = ('0'+d.getDate()).slice(-2);
  return '' + d.getFullYear() + mm + dd;
}

function exportPNG(w, h){
  if(!state.entry){ toast(t('draw')); return; }
  var c = document.createElement('canvas');
  renderCardTo(c, w, h);
  var name = 'danbi-lab_korean-fortune_' + fileDate() + '_' + w + 'x' + h + '.png';
  function done(url){
    var a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    toast(t('saved'));
  }
  if(c.toBlob){
    c.toBlob(function(blob){
      var url = URL.createObjectURL(blob);
      done(url);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 8000);
    }, 'image/png');
  } else {
    done(c.toDataURL('image/png'));
  }
}

function copyText(text){
  function fallback(){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch(e){ ok = false; }
    ta.remove();
    toast(ok ? t('copied') : t('copyFail'));
  }
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(function(){ toast(t('copied')); }, fallback);
  } else { fallback(); }
}

function caption(){
  var e = state.entry;
  return e.ko + '\n' + e.en + '\n' + e.ro + '\n\n"' + (state.lang === 'ko' ? e.noteKo : e.noteEn) + '"\n\nA Korean fortune card from Danbi Lab.\n' + HASHTAGS;
}

var toastTimer = null;
function toast(msg){
  var el = $('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 2400);
}

function bind(){
  card.addEventListener('click', drawCard);
  card.addEventListener('keydown', function(ev){
    if(ev.key === 'Enter' || ev.key === ' '){ ev.preventDefault(); drawCard(); }
  });
  $('drawBtn').addEventListener('click', drawCard);
  $('listenBtn').addEventListener('click', speak);
  $('save23').addEventListener('click', function(){ exportPNG(1000, 1500); });
  $('save916').addEventListener('click', function(){ exportPNG(1080, 1920); });
  $('copyTags').addEventListener('click', function(){ copyText(HASHTAGS); });
  $('copyCaption').addEventListener('click', function(){ copyText(caption()); });
  Array.prototype.forEach.call(document.querySelectorAll('.lang button'), function(b){
    b.addEventListener('click', function(){
      var lg = b.getAttribute('data-lang');
      if(lg === state.lang) return;
      state.lang = lg;
      buildChips(); buildSwatches(); updateLabels(); renderAll();
    });
  });
  window.addEventListener('resize', function(){ /* canvas is resolution-fixed */ });
}

if(document.readyState === 'loading'){ document.addEventListener('DOMContentLoaded', boot); }
else { boot(); }
})();
</script>
