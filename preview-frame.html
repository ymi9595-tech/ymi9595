<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>preview frame (temporary)</title>
<style>
  html,body{margin:0;background:#D7DBE2;font:12px/1.3 ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;color:#3A3F47}
  .lb{padding:5px 10px;letter-spacing:.02em}
  .lb b{color:#111}
  iframe{border:0;display:block;margin:0 auto;background:#fff;box-shadow:0 12px 34px -14px rgba(0,0,0,.45)}
</style>
</head>
<body>
<p class="lb" id="lb"></p>
<iframe id="f" title="preview"></iframe>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var w = parseInt(q.get('w') || '1280', 10);
  var h = parseInt(q.get('h') || '0', 10);
  var u = q.get('u') || '/ymi9595/playground/';
  var f = document.getElementById('f');
  f.style.width = w + 'px';
  f.style.height = (h || Math.max(400, window.innerHeight - 28)) + 'px';
  f.src = u;
  document.getElementById('lb').innerHTML = '<b>' + w + 'px</b> &middot; ' + u;
})();
</script>
</body>
</html>
