<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>preview frame (temporary)</title>
<style>
  html,body{margin:0;background:#D7DBE2;font:12px/1.3 ui-sans-serif,-apple-system,'Segoe UI',Roboto,sans-serif;color:#3A3F47}
  .lb{padding:5px 10px;letter-spacing:.02em;display:flex;gap:10px;align-items:center}
  .lb b{color:#111}
  .lb button{font:600 11px/1 inherit;padding:5px 10px;border-radius:999px;border:1px solid #9AA3B0;background:#fff;cursor:pointer}
  iframe{border:0;display:block;margin:0 auto;background:#fff;box-shadow:0 12px 34px -14px rgba(0,0,0,.45)}
</style>
</head>
<body>
<p class="lb" id="lb"></p>
<iframe id="f" title="preview"></iframe>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var w = parseInt(q.get('w') || '1280', 10);
  var h = parseInt(q.get('h') || '0', 10);
  var u = q.get('u') || '/ymi9595/playground/';
  var f = document.getElementById('f');
  f.style.width = w + 'px';
  f.style.height = (h || Math.max(400, window.innerHeight - 28)) + 'px';
  f.src = u;

  var lb = document.getElementById('lb');
  lb.innerHTML = '<b>' + w + 'px</b> &middot; ' + u;

  /* Test harness only: the shipped danbi-nav.js stands down inside a frame, so
     for a 390px look the same file is fetched and run inside the frame with
     only that frame guard removed. */
  var btn = document.createElement('button');
  btn.textContent = 'run danbi-nav inside frame';
  btn.addEventListener('click', function () {
    fetch('/ymi9595/playground/danbi-nav.js?harness=1').then(function (r) { return r.text(); }).then(function (src) {
      var code = src.replace('if (window.__danbiKitReady) return;', '')
                   .replace('if (window.top !== window.self) return;', '');
      f.contentWindow.eval(code);
      lb.setAttribute('data-done', '1');
    });
  });
  lb.appendChild(btn);
})();
</script>
</body>
</html>
