<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>preview frame</title>
<style>
  html,body{margin:0;background:#e9e4ee}
  #wrap{position:absolute;left:0;top:0}
  iframe{border:0;display:block;background:#FFF7F0}
</style>
</head>
<body>
<div id="wrap"><iframe id="f" src="../" width="1280" height="800" title="preview"></iframe></div>
<script>
  var q = new URLSearchParams(location.search);
  var f = document.getElementById('f');
  var w = parseInt(q.get('w') || '1280', 10);
  var h = parseInt(q.get('h') || '800', 10);
  var hash = q.get('hash') || '';
  var lang = q.get('lang') || '';
  var path = q.get('p') || '../';
  f.width = w; f.height = h;
  document.getElementById('wrap').style.width = w + 'px';
  document.getElementById('wrap').style.height = h + 'px';
  if (lang) { try { localStorage.setItem('kbc-lang', lang); } catch (e) {} }
  f.src = path + (hash ? '#' + hash : '');
</script>
</body>
</html>
