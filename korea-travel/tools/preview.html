<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>preview frame</title>
<style>
  html,body{margin:0;background:#EDE7F2}
  #wrap{position:absolute;left:0;top:0;overflow:hidden}
  iframe{border:0;display:block;background:#FFF7F0}
</style>
</head>
<body>
<div id="wrap"><iframe id="f" src="../" width="1280" height="800" title="preview"></iframe></div>
<script>
  var q = new URLSearchParams(location.search);
  var f = document.getElementById('f');
  var w = parseInt(q.get('w') || '1280', 10);
  var h = parseInt(q.get('h') || '800', 10);
  var hash = q.get('hash') || '';
  var lang = q.get('lang') || '';
  var scroll = parseInt(q.get('scroll') || '0', 10);
  if (lang) { try { localStorage.setItem('kbc-lang', lang); } catch (e) {} }
  f.width = w; f.height = h;
  var wrap = document.getElementById('wrap');
  wrap.style.width = w + 'px'; wrap.style.height = h + 'px';
  var bust = q.get('b') || '';
  f.src = '../' + (bust ? '?v=' + bust : '') + (hash ? '#' + hash : '');
  f.addEventListener('load', function () {
    setTimeout(function () {
      try {
        var d = f.contentDocument;
        var s = d.createElement('style');
        s.textContent = 'html{scrollbar-width:none}::-webkit-scrollbar{width:0;height:0;display:none}';
        d.head.appendChild(s);
        if (scroll) {
          var el = d.querySelector('#city');
          if (hash && el && !el.hidden) el.scrollTop = scroll; else d.documentElement.scrollTop = scroll;
        }
        var doc = d.documentElement;
        var target = (hash && d.querySelector('#city') && !d.querySelector('#city').hidden) ? d.querySelector('#city') : doc;
        document.title = 'w=' + w + ' ov=' + (target.scrollWidth - target.clientWidth) +
          ' cards=' + d.querySelectorAll('.card').length +
          ' steps=' + d.querySelectorAll('#city .step').length +
          ' imgs=' + d.querySelectorAll('img').length +
          ' broken=' + Array.from(d.querySelectorAll('img')).filter(function (i) { return i.complete && i.naturalWidth === 0; }).length;
      } catch (e) { document.title = 'ERR ' + e.message; }
    }, 1200);
  }, { once: true });
</script>
</body>
</html>
